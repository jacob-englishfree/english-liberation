<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>영어해방공식 — 단어 마스터</title>
<meta name="theme-color" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;border:none;outline:none;background:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}

:root{
  --bg:#F4F5F7;--card:#FFFFFF;--blue:#3182F6;--blue-d:#1B64DA;--blue-l:#EBF4FF;--blue-xl:#F5F9FF;
  --green:#00C072;--green-l:#E8FAF0;--red:#F04452;--red-l:#FFF0F0;
  --yellow:#F59E0B;--yellow-l:#FFF8E1;--purple:#8B5CF6;--purple-l:#F3EEFF;
  --orange:#FF6B35;
  --text:#191F28;--sub:#4E5968;--hint:#8B95A1;--border:#E5E8EB;--divider:#F2F4F6;
  --g900:#191F28;--g800:#333D4B;--g700:#4E5968;--g600:#6B7684;--g500:#8B95A1;
  --g400:#B0B8C1;--g300:#D1D6DB;--g200:#E5E8EB;--g100:#F2F4F6;--g50:#F9FAFB;
  --shadow:0 2px 8px rgba(0,0,0,.04);--shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:9999px;
  --ease:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur:.2s;--dur-slow:.35s;
  --nav-bg:rgba(255,255,255,.88);--bottom-bg:rgba(255,255,255,.92);
}
[data-theme="dark"]{
  --bg:#0F0F0F;--card:#1A1A1A;--text:#F0F0F0;--sub:#A0A0A0;--hint:#666;
  --border:#2A2A2A;--divider:#222;--blue-l:#1A2F4D;--green-l:#0F2E1F;--red-l:#3D1A1E;
  --yellow-l:#2E2510;--purple-l:#1E1535;
  --g900:#ECECEC;--g800:#D0D0D0;--g700:#B0B0B0;--g600:#909090;--g500:#707070;
  --g400:#505050;--g300:#404040;--g200:#333;--g100:#222;--g50:#1A1A1A;
  --shadow:0 2px 8px rgba(0,0,0,.2);--shadow-lg:0 8px 24px rgba(0,0,0,.3);
  --nav-bg:rgba(15,15,15,.88);--bottom-bg:rgba(15,15,15,.92);
}

.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.page{display:none;animation:pageIn .3s var(--ease)}
.page.active{display:block}
.sub-page{display:none;animation:pageIn .3s var(--ease)}
.sub-page.active{display:block}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--bottom-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav-inner{max-width:480px;margin:0 auto;display:flex;height:56px}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--hint);transition:color .2s;position:relative}
.nav-tab.active{color:var(--blue)}
.nav-tab .nav-icon{font-size:20px;line-height:1}
.nav-tab .nav-label{font-size:10px;font-weight:600;letter-spacing:-.2px}
.nav-tab.active .nav-label{font-weight:700}
.nav-tab.disabled{opacity:.35;pointer-events:none}

.header{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.header-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:20px;color:var(--sub)}
.header-back:active{background:var(--g100)}
.header-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.header-right{width:36px}

.card{background:var(--card);border-radius:var(--r-lg);padding:20px;margin:0 20px 12px;box-shadow:var(--shadow)}
.card-sm{padding:16px}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.chip{height:36px;padding:0 16px;border-radius:var(--r-full);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--g100);color:var(--sub);transition:all .15s var(--ease);
  border:1.5px solid transparent;white-space:nowrap;min-width:44px}
.chip:active{transform:scale(.96)}
.chip.selected{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.chip.selected-green{background:var(--green-l);color:var(--green);border-color:var(--green)}

.btn{height:52px;border-radius:var(--r-lg);font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;width:100%;
  transition:all .15s var(--ease);letter-spacing:-.3px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:disabled{background:var(--g200);color:var(--g400)}
.btn-secondary{background:var(--blue-l);color:var(--blue)}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--sub)}
.btn-sm{height:40px;font-size:14px;border-radius:var(--r-md)}
.btn-xs{height:32px;font-size:13px;border-radius:var(--r-sm);padding:0 12px;width:auto}

.sec-label{font-size:13px;font-weight:700;color:var(--sub);padding:24px 20px 10px;letter-spacing:-.2px}
.sec-title{font-size:20px;font-weight:800;letter-spacing:-.4px;padding:0 20px 4px}
.sec-desc{font-size:14px;color:var(--sub);padding:0 20px 16px}

.unit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 20px}
.unit-cell{height:44px;border-radius:var(--r-md);font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1.5px solid var(--border);color:var(--sub);
  transition:all .15s var(--ease)}
.unit-cell:active{transform:scale(.95)}
.unit-cell.selected{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.unit-cell.disabled{opacity:.3;pointer-events:none;background:var(--g100)}
.unit-cell.passed{border-color:var(--green);color:var(--green)}

.range-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px;margin-bottom:8px}
.range-chip{height:32px;padding:0 12px;border-radius:var(--r-full);font-size:12px;font-weight:600;
  background:var(--g100);color:var(--sub);border:1.5px solid transparent;
  display:inline-flex;align-items:center}
.range-chip:active{transform:scale(.96)}
.range-chip.selected{background:var(--purple-l);color:var(--purple);border-color:var(--purple)}

.slider-wrap{padding:0 20px;margin:8px 0}
.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--g200);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--blue);cursor:pointer;box-shadow:0 2px 6px rgba(49,130,246,.3)}
.slider-labels{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;color:var(--hint)}

.num-input{width:80px;height:40px;text-align:center;font-size:16px;font-weight:700;
  border:2px solid var(--border);border-radius:var(--r-md);background:var(--card)}
.num-input:focus{border-color:var(--blue)}

/* ━━ HOME CARDS ━━ */
.home-hero{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero-card{border-radius:var(--r-xl);padding:24px 20px;min-height:130px;display:flex;flex-direction:column;
  justify-content:space-between;cursor:pointer;transition:all .15s var(--ease);position:relative;overflow:hidden}
.hero-card:active{transform:scale(.97)}
.hero-card-study{background:linear-gradient(135deg,#3182F6,#6C5CE7);color:#fff}
.hero-card-test{background:linear-gradient(135deg,#00C072,#00A3FF);color:#fff}
.hero-card .hc-icon{font-size:32px}
.hero-card .hc-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.hero-card .hc-desc{font-size:12px;opacity:.85;margin-top:2px}
.hero-card::after{content:'';position:absolute;right:-20px;bottom:-20px;width:80px;height:80px;
  border-radius:50%;background:rgba(255,255,255,.1)}

.rank-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--divider)}
.rank-item:last-child{border-bottom:none}
.rank-medal{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.rank-name{font-size:15px;font-weight:600;flex:1}
.rank-name.me{color:var(--blue);font-weight:800}
.rank-stat{font-size:12px;color:var(--sub);text-align:right}
.rank-stat strong{font-size:14px;font-weight:800;color:var(--text)}

.today-word{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--divider)}
.today-word:last-child{border-bottom:none}
.tw-left{display:flex;flex-direction:column;gap:2px}
.tw-en{font-size:15px;font-weight:700}
.tw-kr{font-size:13px;color:var(--sub)}
.tw-speak{font-size:18px;padding:8px}

.review-banner{margin:0 20px 12px;padding:14px 16px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--yellow-l),var(--orange)15%,var(--yellow-l));
  display:flex;align-items:center;gap:12px;cursor:pointer}
.review-banner:active{transform:scale(.98)}
.review-banner .rb-icon{font-size:24px}
.review-banner .rb-text{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}

.xp-section{padding:0 20px;margin:12px 0}
.xp-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-level{font-size:14px;font-weight:700;color:var(--blue)}
.xp-text{font-size:12px;color:var(--hint)}
.xp-bar{height:8px;border-radius:4px;background:var(--g200);overflow:hidden}
.xp-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--purple));
  transition:width .5s var(--ease)}

.streak-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
  border-radius:var(--r-full);font-size:14px;font-weight:700;
  background:linear-gradient(135deg,#FF6B35,#F04452);color:#fff;
  animation:streakGlow 2s infinite alternate}

.history-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider)}
.history-item:last-child{border-bottom:none}
.hi-icon{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.hi-info{flex:1}
.hi-title{font-size:14px;font-weight:600}
.hi-sub{font-size:12px;color:var(--hint)}
.hi-score{font-size:14px;font-weight:700}

/* ━━ STUDY MODE CARDS ━━ */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.mode-card{border-radius:var(--r-xl);padding:24px 16px;display:flex;flex-direction:column;
  align-items:flex-start;gap:8px;transition:all .15s var(--ease);cursor:pointer;
  background:var(--card);box-shadow:var(--shadow);min-height:120px}
.mode-card:active{transform:scale(.97)}
.mode-card .mode-icon{font-size:28px}
.mode-card .mode-name{font-size:16px;font-weight:700;letter-spacing:-.3px}
.mode-card .mode-desc{font-size:12px;color:var(--sub);line-height:1.4}
.mode-card.featured{grid-column:1/-1;background:linear-gradient(135deg,var(--blue),#6C5CE7);
  color:#fff;min-height:100px;flex-direction:row;align-items:center;gap:16px;padding:20px 24px}
.mode-card.featured .mode-desc{color:rgba(255,255,255,.8)}

/* ━━ FLASHCARD ━━ */
.fc-container{perspective:1000px;margin:20px;height:320px}
.fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s var(--ease)}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-xl);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;background:var(--card);box-shadow:var(--shadow-lg)}
.fc-back{transform:rotateY(180deg)}
.fc-word{font-size:32px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.fc-pron{font-size:14px;color:var(--hint);margin-top:4px}
.fc-speaker{font-size:28px;margin-top:12px;cursor:pointer}
.fc-meaning{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.fc-deriv{font-size:13px;color:var(--sub);background:var(--g100);padding:4px 12px;border-radius:var(--r-full);margin:6px 0}
.fc-example{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;margin-top:8px}
.fc-source{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  background:var(--blue-l);color:var(--blue);margin-top:4px}
.fc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px;margin-top:16px}
.fc-btn{height:56px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-weight:700;background:var(--card);box-shadow:var(--shadow);transition:all .15s}
.fc-btn:active{transform:scale(.95)}
.fc-btn .fc-emoji{font-size:20px}
.fc-btn .fc-label{font-size:11px;color:var(--sub)}
.fc-progress{display:flex;gap:6px;padding:0 20px;margin:12px 0;align-items:center}
.fc-prog-bar{flex:1;height:6px;border-radius:3px;background:var(--g200);overflow:hidden}
.fc-prog-fill{height:100%;border-radius:3px;transition:width .3s var(--ease)}
.fc-prog-text{font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
.fc-stats{display:flex;justify-content:center;gap:16px;margin:8px 0}
.fc-stat{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}

/* ━━ QUIZ / TEST ━━ */
.quiz-word{font-size:28px;font-weight:800;text-align:center;padding:32px 20px 8px;letter-spacing:-.5px}
.quiz-pron{font-size:14px;color:var(--hint);text-align:center;margin-bottom:4px}
.quiz-speaker{font-size:24px;text-align:center;margin-bottom:20px;cursor:pointer}
.quiz-options{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.quiz-opt{min-height:52px;padding:14px 20px;border-radius:var(--r-lg);font-size:15px;font-weight:600;
  background:var(--card);border:1.5px solid var(--border);color:var(--text);text-align:left;
  display:flex;align-items:center;gap:12px;transition:all .15s var(--ease);
  cursor:pointer;-webkit-tap-highlight-color:transparent;width:100%;position:relative;z-index:10}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt .opt-num{width:28px;height:28px;border-radius:50%;background:var(--g100);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);flex-shrink:0}
.quiz-opt.correct{background:var(--green-l);border-color:var(--green);color:var(--green)}
.quiz-opt.correct .opt-num{background:var(--green);color:#fff}
.quiz-opt.wrong{background:var(--red-l);border-color:var(--red);color:var(--red);animation:shake .3s}
.quiz-opt.wrong .opt-num{background:var(--red);color:#fff}
.quiz-opt.show-correct{background:var(--green-l);border-color:var(--green);color:var(--green)}
.quiz-opt.show-correct .opt-num{background:var(--green);color:#fff}

/* ━━ TIMER BAR ━━ */
.timer-bar-wrap{height:6px;margin:0 20px 8px;border-radius:3px;background:var(--g200);overflow:hidden}
.timer-bar-fill{height:100%;border-radius:3px;transition:width .1s linear;background:var(--green)}
.timer-bar-fill.warn{background:var(--yellow)}
.timer-bar-fill.danger{background:var(--red)}

.timer-ring{width:48px;height:48px;margin:0 auto 12px;position:relative}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:4}
.timer-ring .bg{stroke:var(--g200)}
.timer-ring .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer-ring.warn .fg{stroke:var(--red)}
.combo{font-size:48px;font-weight:900;text-align:center;color:var(--blue);
  animation:comboPulse .3s var(--ease-spring)}

/* ━━ TYPING ━━ */
.type-input{width:calc(100% - 40px);margin:0 20px;height:52px;padding:0 20px;
  border-radius:var(--r-lg);background:var(--card);border:2px solid var(--border);
  font-size:18px;font-weight:600;text-align:center;transition:border-color .2s}
.type-input:focus{border-color:var(--blue)}
.type-input.correct{border-color:var(--green);background:var(--green-l)}
.type-input.wrong{border-color:var(--red);background:var(--red-l);animation:shake .3s}

/* ━━ MATCHING ━━ */
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px}
.match-cell{aspect-ratio:1;border-radius:var(--r-md);background:var(--card);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;
  font-size:12px;font-weight:600;transition:all .2s var(--ease)}
.match-cell.selected{border-color:var(--blue);background:var(--blue-l);transform:scale(.95)}
.match-cell.matched{background:var(--green-l);border-color:var(--green);opacity:.6;pointer-events:none}
.match-cell.wrong{animation:shake .3s;border-color:var(--red)}

/* ━━ PROGRESS BAR ━━ */
.test-progress{height:4px;background:var(--g200);position:sticky;top:0;z-index:10}
.test-progress-fill{height:100%;background:var(--blue);transition:width .3s var(--ease)}

/* ━━ RESULT ━━ */
.result-hero{text-align:center;padding:40px 20px 20px}
.result-score{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1}
.result-label{font-size:14px;color:var(--sub);font-weight:600;margin-top:4px}
.result-circle{width:160px;height:160px;margin:0 auto 16px;position:relative}
.result-circle svg{transform:rotate(-90deg)}
.result-circle .score-text{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.xp-float{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:24px;font-weight:900;color:var(--blue);pointer-events:none;animation:xpFloat 1.5s var(--ease) forwards}

/* ━━ WRONG WORD LIST ━━ */
.wrong-item{display:flex;align-items:center;gap:12px;padding:14px 20px;
  border-bottom:1px solid var(--divider)}
.wrong-item:last-child{border-bottom:none}
.wrong-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wrong-word{font-size:15px;font-weight:700;flex:1}
.wrong-meaning{font-size:13px;color:var(--sub);flex:2}
.wrong-count{font-size:12px;font-weight:700;color:var(--red);background:var(--red-l);
  padding:2px 8px;border-radius:var(--r-full)}

/* ━━ STATS ━━ */
.stat-circle{width:120px;height:120px;margin:0 auto}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 20px}
.heat-cell{aspect-ratio:1;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center}
.heat-cell.empty{background:var(--g100);color:var(--hint)}
.heat-cell.filled{background:var(--green);color:#fff}
.bar-row{display:flex;align-items:center;gap:8px;padding:6px 20px}
.bar-label{font-size:12px;font-weight:600;color:var(--sub);width:48px;text-align:right}
.bar-track{flex:1;height:8px;border-radius:4px;background:var(--g100);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s var(--ease)}

/* ━━ ONBOARDING ━━ */
.onboard-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 32px}
.onboard-emoji{font-size:64px;margin-bottom:24px}
.onboard-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:8px;letter-spacing:-.3px}
.onboard-desc{font-size:15px;color:var(--sub);text-align:center;line-height:1.6;margin-bottom:40px}
.onboard-dots{display:flex;gap:8px;margin-bottom:32px}
.onboard-dot{width:8px;height:8px;border-radius:50%;background:var(--g300)}
.onboard-dot.active{background:var(--blue);width:24px;border-radius:4px;transition:all .3s var(--ease)}

/* ━━ MODAL / TOAST ━━ */
.modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-content{background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:24px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px;
  animation:slideUp .3s var(--ease)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--g300);margin:0 auto 16px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--g800);color:#fff;padding:12px 20px;border-radius:var(--r-full);
  font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .3s var(--ease)}

.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall 2.5s linear forwards}

/* ━━ SETTINGS ━━ */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;
  border-bottom:1px solid var(--divider)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:15px;font-weight:600}
.setting-desc{font-size:12px;color:var(--hint)}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--g300);position:relative;
  transition:background .2s;cursor:pointer;flex-shrink:0}
.toggle.on{background:var(--blue)}
.toggle-knob{width:24px;height:24px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;
  transition:transform .2s var(--ease-spring);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.toggle.on .toggle-knob{transform:translateX(20px)}

.listen-prompt{font-size:48px;text-align:center;padding:40px 0 24px}
.listen-step{font-size:13px;font-weight:700;color:var(--blue);text-align:center;
  background:var(--blue-l);display:inline-block;padding:4px 12px;border-radius:var(--r-full);margin:0 auto;
  position:relative;left:50%;transform:translateX(-50%)}

/* ━━ ANIMATIONS ━━ */
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes comboPulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes xpFloat{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-120px)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes scoreCountUp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes streakGlow{from{box-shadow:0 0 8px rgba(255,107,53,.3)}to{box-shadow:0 0 16px rgba(255,107,53,.6)}}
@keyframes badgeIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes progressFill{from{width:0}to{width:var(--w)}}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes speakerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.speaker-anim{animation:speakerPulse .6s var(--ease) 2}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
</style>
</head>

/* ━━ TTS ━━ */
let voices=[];
speechSynthesis.onvoiceschanged=()=>{voices=speechSynthesis.getVoices()};
function speak(text){
  if(!settings.sound)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';
  u.rate=settings.ttsSpeed==='slow'?.7:settings.ttsSpeed==='fast'?1.2:.9;
  const v=voices.find(v=>v.name.includes('Google')&&v.lang.startsWith('en'))
    ||voices.find(v=>v.name.includes('Samantha'))
    ||voices.find(v=>v.lang.startsWith('en-US')&&v.localService)
    ||voices.find(v=>v.lang.startsWith('en'));
  if(v)u.voice=v;speechSynthesis.speak(u);
}
speechSynthesis.getVoices();

/* ━━ UTILS ━━ */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function today(){return new Date().toISOString().slice(0,10)}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/864e5)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function getUnitWords(units){return VOCAB_DATA.filter(w=>units.includes(w.unit))}
function getDistractors(correct,pool,count){
  count=count||3;
  const opts=pool.filter(w=>w.meaning!==correct.meaning);
  return shuffle(opts).slice(0,count).map(w=>w.meaning);
}
function anonymizeName(name){if(!name||name.length<2)return name;return name[0]+'\u25CB'+name[name.length-1]}

function addXp(amount){
  xpData.xp+=amount;
  const needed=xpData.lv*100;
  if(xpData.xp>=needed){xpData.xp-=needed;xpData.lv++;playLevelUp();toast('Level '+xpData.lv+' !')}
  saveAll();showXpFloat(amount);
}
function showXpFloat(amount){
  const el=document.getElementById('xp-float');el.textContent='+'+amount+' XP';el.style.display='block';
  el.style.animation='none';el.offsetHeight;el.style.animation='xpFloat 1.5s var(--ease) forwards';
  setTimeout(()=>el.style.display='none',1500);
}
function updateStreak(){
  const t=today();
  if(streak.lastDate===t)return;
  if(streak.lastDate&&daysBetween(streak.lastDate,t)===1)streak.count++;
  else streak.count=1;
  streak.lastDate=t;saveAll();
}
function addHistory(type,label,score){
  history.unshift({type:type,label:label,score:score,date:today(),time:Date.now()});
  if(history.length>20)history=history.slice(0,20);saveAll();
}
function logStudy(units){const t=today();if(!studyLog[t])studyLog[t]=[];units.forEach(u=>{if(!studyLog[t].includes(u))studyLog[t].push(u)});saveAll()}

/* ━━ RANKING ━━ */
async function loadRanking(){
  if(!studentId){return[]}
  try{
    const {data:student}=await sb.from('students').select('curriculum,name').eq('id',studentId).single();
    if(!student||!student.curriculum)return[];
    const {data:peers}=await sb.from('students').select('id,name').eq('curriculum',student.curriculum).eq('status','재원');
    if(!peers||!peers.length)return[];
    const ids=peers.map(p=>p.id);
    const {data:results}=await sb.from('vocab_results').select('student_id,unit,score,passed').in('student_id',ids);
    if(!results)return[];
    const peerMap={};
    peers.forEach(p=>{peerMap[p.id]={name:p.name,passedUnits:new Set(),totalScore:0,testCount:0}});
    results.forEach(r=>{
      if(!peerMap[r.student_id])return;
      if(r.passed)peerMap[r.student_id].passedUnits.add(r.unit);
      peerMap[r.student_id].totalScore+=r.score;
      peerMap[r.student_id].testCount++;
    });
    const ranking=Object.entries(peerMap).map(function(entry){
      const id=entry[0],d=entry[1];
      return{id:id,name:d.name,passedCount:d.passedUnits.size,
        avgScore:d.testCount?Math.round(d.totalScore/d.testCount):0,isMe:id===studentId};
    }).sort(function(a,b){return b.passedCount-a.passedCount||b.avgScore-a.avgScore});
    return ranking;
  }catch(e){console.warn('loadRanking error:',e);return[]}
}

  }
  rangesEl.innerHTML=rangeHtml;

  unitsEl.innerHTML=html;

  var chipsEl=document.getElementById(prefix+'-count-chips');
  var counts=[10,20,33,50];
  var currentCount=prefix==='study'?studyCount:testCount;
  chipsEl.innerHTML=counts.map(function(n){

/* ━━ FLASHCARD MODE ━━ */
function startFlashcard(){
  var words=shuffle(getUnitWords(studySelectedUnits)).slice(0,studyCount);
  if(!words.length)return;
  var pool=VOCAB_DATA.filter(function(w){return w.unit>0});
  var idx=0,mastered=0,learning=0,unseen=words.length;
  var el=document.getElementById('study-session');

  function render(){
    var w=words[idx];var ws=wordStates[w.num]||{level:0};
    var hasDeriv=w.derivatives&&w.derivatives.length>0;
    var derivText=hasDeriv?w.derivatives[0]:'';
    el.innerHTML=
      '<div class="header">'+
        '<button class="header-back" onclick="endStudySession()">\u2190</button>'+
        '<div class="header-title">\uD50C\uB798\uC2DC\uCE74\uB4DC</div>'+
        '<div class="header-right" style="font-size:13px;color:var(--sub)">'+(idx+1)+'/'+words.length+'</div></div>'+
      '<div class="fc-progress"><div class="fc-prog-bar"><div class="fc-prog-fill" style="width:'+(idx/words.length*100)+'%;background:var(--blue)"></div></div>'+
        '<div class="fc-prog-text">'+(idx+1)+'/'+words.length+'</div></div>'+
      '<div class="fc-stats">'+
        '<div class="fc-stat" style="color:var(--green)">\u2705 '+mastered+'</div>'+
        '<div class="fc-stat" style="color:var(--yellow)">\uD83D\uDCD6 '+learning+'</div>'+
        '<div class="fc-stat" style="color:var(--hint)">\u2B1C '+unseen+'</div></div>'+
      '<div class="fc-container" id="fc-wrap" onclick="flipCard()">'+
        '<div class="fc-card" id="fc-card">'+
          '<div class="fc-front">'+
            '<div class="fc-word">'+w.word+'</div>'+
            (w.pronunciation?'<div class="fc-pron">'+w.pronunciation+'</div>':'')+
            '<div class="fc-speaker" onclick="event.stopPropagation();speak(\''+w.word.replace(/'/g,"\\'")+'\')">\uD83D\uDD0A</div>'+
            '<div style="font-size:13px;color:var(--hint);margin-top:16px">\uD0ED\uD558\uC5EC \uB4A4\uC9D1\uAE30</div></div>'+
          '<div class="fc-back">'+
            '<div class="fc-meaning">'+w.meaning+'</div>'+
            (derivText?'<div class="fc-deriv">'+derivText+'</div>':'')+
            (w.example_en?'<div class="fc-example">'+w.example_en+'<br><span style="color:var(--hint)">'+w.example_kr+'</span></div>':'')+
            (w.source?'<span class="fc-source">'+w.source+'</span>':'')+'</div></div></div>'+
      '<div class="fc-buttons" id="fc-btns" style="display:none">'+
        '<button class="fc-btn" onclick="rateCard(0)" style="border-left:3px solid var(--red)"><span class="fc-emoji">\uD83D\uDE30</span><span class="fc-label">\uB2E4\uC2DC</span></button>'+
        '<button class="fc-btn" onclick="rateCard(1)" style="border-left:3px solid var(--orange)"><span class="fc-emoji">\uD83E\uDD14</span><span class="fc-label">\uC5B4\uB824\uC6C0</span></button>'+
        '<button class="fc-btn" onclick="rateCard(2)" style="border-left:3px solid var(--green)"><span class="fc-emoji">\u2705</span><span class="fc-label">\uC88B\uC74C</span></button>'+
        '<button class="fc-btn" onclick="rateCard(3)" style="border-left:3px solid var(--blue)"><span class="fc-emoji">\uD83C\uDFAF</span><span class="fc-label">\uC26C\uC6C0</span></button></div>';
    speak(w.word);
    var startX=0;var wrap=document.getElementById('fc-wrap');
    wrap.addEventListener('touchstart',function(e){startX=e.touches[0].clientX},{passive:true});
    wrap.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>60){if(dx>0&&idx>0){idx--;render()}else if(dx<0){flipCard()}}},{passive:true});
  }

  window.flipCard=function(){
    var card=document.getElementById('fc-card');
    if(card.classList.contains('flipped'))return;
    card.classList.add('flipped');playFlip();haptic('flip');
    document.getElementById('fc-btns').style.display='grid';
  };

  window.rateCard=function(level){
    var w=words[idx];
    var intervals=[0,1,3,7];
    var nextDate=new Date();nextDate.setDate(nextDate.getDate()+intervals[level]);
    wordStates[w.num]={level:level,nextReview:nextDate.toISOString().slice(0,10),
      wrongCount:(wordStates[w.num]&&wordStates[w.num].wrongCount||0)+(level===0?1:0),lastSeen:today()};
    if(level>=2){mastered++;unseen=Math.max(0,unseen-1)}
    else if(level===1){learning++;unseen=Math.max(0,unseen-1)}
    playClick();haptic('click');saveAll();
    if(idx<words.length-1){idx++;render()}
    else endFlashcard(mastered,learning,words.length);
  };

  window.endStudySession=function(){showStudySub('study-select')};
  showStudySub('study-session');render();updateStreak();logStudy(studySelectedUnits);
}

function startListening(){
  var words=shuffle(getUnitWords(studySelectedUnits)).slice(0,studyCount);
  if(!words.length)return;
  var pool=VOCAB_DATA.filter(function(w){return w.unit>0});
  var idx=0,step=1,correct=0;
  var el=document.getElementById('study-session');

  function render(){
    var w=words[idx];
    var distractors=getDistractors(w,pool);
    var options=shuffle([w.meaning].concat(distractors));

    if(step===1){
      el.innerHTML=
        '<div class="header"><button class="header-back" onclick="endStudySession()">\u2190</button>'+

/* ━━ SPEED QUIZ ━━ */
function startSpeedQuiz(){
  var words=shuffle(getUnitWords(studySelectedUnits)).slice(0,studyCount);
  if(!words.length)return;
  var pool=VOCAB_DATA.filter(function(w){return w.unit>0});
  var idx=0,correct=0,combo=0,maxCombo=0;
  var el=document.getElementById('study-session');
  var R=Math.PI*2*18;

  function render(){
    var w=words[idx];
    var distractors=getDistractors(w,pool);
    var options=shuffle([w.meaning].concat(distractors));
    el.innerHTML=
      '<div class="header"><button class="header-back" onclick="clearInterval(window._speedTimer);endStudySession()">\u2190</button>'+
        '<div class="header-title">\uC2A4\uD53C\uB4DC\uD034\uC988</div><div class="header-right" style="font-size:13px;color:var(--sub)">'+(idx+1)+'/'+words.length+'</div></div>'+
      '<div class="test-progress"><div class="test-progress-fill" style="width:'+(idx/words.length*100)+'%"></div></div>'+
      (combo>=3?'<div class="combo">'+combo+' COMBO!</div>':'')+
      '<div style="position:relative;width:48px;height:48px;margin:16px auto">'+
        '<svg width="48" height="48"><circle cx="24" cy="24" r="18" stroke="var(--g200)" stroke-width="4" fill="none"/>'+
        '<circle cx="24" cy="24" r="18" id="speed-ring" stroke="var(--blue)" stroke-width="4" fill="none"'+
          ' stroke-dasharray="'+R+'" stroke-dashoffset="0" stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:center"/></svg>'+
        '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700" id="speed-time">5</div></div>'+
      '<div class="quiz-word">'+w.word+'</div>'+
      (w.pronunciation?'<div class="quiz-pron">'+w.pronunciation+'</div>':'')+
      '<div class="quiz-options">'+options.map(function(o,i){
        return '<button class="quiz-opt" onclick="checkSpeed(this,'+(o===w.meaning)+')"><span class="opt-num">'+(i+1)+'</span>'+o+'</button>'
      }).join('')+'</div>';

    clearInterval(window._speedTimer);
    var elapsed=0;
    window._speedTimer=setInterval(function(){
      elapsed+=100;var left=5-elapsed/1000;
      var timeEl=document.getElementById('speed-time');if(timeEl)timeEl.textContent=Math.ceil(left);
      var ring=document.getElementById('speed-ring');
      if(ring){ring.setAttribute('stroke-dashoffset',R*(elapsed/5000));
        if(left<=2)ring.setAttribute('stroke','var(--red)')}
      if(left<=0){clearInterval(window._speedTimer);combo=0;playWrong();haptic('wrong');
        setTimeout(function(){idx++;if(idx<words.length)render();else endSpeed()},800)}
    },100);
    speak(w.word);
  }

  window.checkSpeed=function(btn,isCorrect){
    if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
    clearInterval(window._speedTimer);
    if(isCorrect){btn.classList.add('correct');playCorrect();haptic('correct');correct++;combo++;maxCombo=Math.max(maxCombo,combo)}
    else{btn.classList.add('wrong');playWrong();haptic('wrong');combo=0;
      btn.parentElement.querySelectorAll('.quiz-opt').forEach(function(o){if(!o.classList.contains('wrong'))o.classList.add('show-correct')})}
    setTimeout(function(){idx++;if(idx<words.length)render();else endSpeed()},isCorrect?400:1200);
  };

  function endSpeed(){
    clearInterval(window._speedTimer);
    var score=Math.round(correct/words.length*100);
    addXp(correct*4+maxCombo*2);
    addHistory('speed',studySelectedUnits.map(function(u){return u+'\uACFC'}).join(','),score);
    el.innerHTML='<div class="result-hero"><div style="font-size:48px;margin-bottom:16px">\u26A1</div>'+
      '<div style="font-size:28px;font-weight:800">\uC2A4\uD53C\uB4DC\uD034\uC988 \uC644\uB8CC!</div>'+
      '<div style="font-size:16px;color:var(--sub);margin-top:8px">'+correct+'/'+words.length+' \uC815\uB2F5 (\uCD5C\uB300 '+maxCombo+' \uCF64\uBCF4)</div>'+
      '<div style="font-size:48px;font-weight:900;margin-top:16px;color:'+(score>=80?'var(--green)':'var(--red)')+'">'+score+'\uC810</div></div>'+
      '<div style="padding:20px"><button class="btn btn-primary" onclick="showStudySub(\'study-select\')">\uB3CC\uC544\uAC00\uAE30</button></div>';
  }

  showStudySub('study-session');render();updateStreak();logStudy(studySelectedUnits);
}

/* ━━ DEEP STUDY ━━ */
function startDeepStudy(){
  var words=shuffle(getUnitWords(studySelectedUnits)).slice(0,studyCount);
  if(!words.length)return;
  var pool=VOCAB_DATA.filter(function(w){return w.unit>0});
  var idx=0,correct=0;
  var el=document.getElementById('study-session');
  var types=['example_blank','derivative','kr_to_en','spelling'];
  var typeIdx=0;

  function render(){
    if(idx>=words.length){endDeep();return}
    if(idx>0&&idx%8===0&&typeIdx===0){renderMatching();return}
    var w=words[idx];
    var type=types[typeIdx%types.length];

    if(type==='example_blank'){
      var ex=w.example_en||('The '+w.word+' was important.');
      var blanked=ex.replace(new RegExp(w.word,'gi'),'______');
      var dWords=shuffle(pool.filter(function(x){return x.num!==w.num})).slice(0,3).map(function(x){return x.word});
      var options=shuffle([w.word].concat(dWords));
      el.innerHTML=
        '<div class="header"><button class="header-back" onclick="endStudySession()">\u2190</button>'+
          '<div class="header-title">\uC2EC\uD654\uD559\uC2B5</div><div class="header-right" style="font-size:13px;color:var(--sub)">'+(idx+1)+'/'+words.length+'</div></div>'+
        '<div class="test-progress"><div class="test-progress-fill" style="width:'+(idx/words.length*100)+'%"></div></div>'+
        '<div style="padding:16px 20px;text-align:center;font-size:13px;font-weight:600;color:var(--purple)">\uC608\uBB38 \uBE48\uCE78</div>'+
        '<div style="padding:8px 24px;font-size:15px;line-height:1.8;text-align:center;color:var(--text)">'+blanked+'</div>'+
        (w.source?'<div style="text-align:center"><span class="fc-source">'+w.source+'</span></div>':'')+
        '<div style="height:16px"></div>'+
        '<div class="quiz-options">'+options.map(function(o,i){
          return '<button class="quiz-opt" onclick="checkDeep(this,'+(o===w.word)+')"><span class="opt-num">'+(i+1)+'</span>'+o+'</button>'}).join('')+'</div>';
    }else if(type==='derivative'){
      if(!w.derivatives||!w.derivatives.length){typeIdx++;render();return}
      var d=w.derivatives[0];
      var distD=shuffle(pool.filter(function(x){return x.derivatives&&x.derivatives.length>0&&x.num!==w.num})).slice(0,3).map(function(x){return x.derivatives[0]});
      var opts=shuffle([d].concat(distD));
      el.innerHTML=
        '<div class="header"><button class="header-back" onclick="endStudySession()">\u2190</button>'+
          '<div class="header-title">\uC2EC\uD654\uD559\uC2B5</div><div class="header-right" style="font-size:13px;color:var(--sub)">'+(idx+1)+'/'+words.length+'</div></div>'+
        '<div class="test-progress"><div class="test-progress-fill" style="width:'+(idx/words.length*100)+'%"></div></div>'+
        '<div style="padding:16px 20px;text-align:center;font-size:13px;font-weight:600;color:var(--orange)">\uD30C\uC0DD\uC5B4</div>'+
        '<div class="quiz-word">'+w.word+'</div>'+
        '<div style="text-align:center;font-size:14px;color:var(--sub);margin-bottom:16px">'+w.meaning+'</div>'+
        '<div class="quiz-options">'+opts.map(function(o,i){
          return '<button class="quiz-opt" onclick="checkDeep(this,'+(o===d)+')"><span class="opt-num">'+(i+1)+'</span>'+o+'</button>'}).join('')+'</div>';
    }else if(type==='kr_to_en'){
      var distW=shuffle(pool.filter(function(x){return x.num!==w.num})).slice(0,3).map(function(x){return x.word});
      var opts2=shuffle([w.word].concat(distW));
      el.innerHTML=
        '<div class="header"><button class="header-back" onclick="endStudySession()">\u2190</button>'+
          '<div class="header-title">\uC2EC\uD654\uD559\uC2B5</div><div class="header-right" style="font-size:13px;color:var(--sub)">'+(idx+1)+'/'+words.length+'</div></div>'+
        '<div class="test-progress"><div class="test-progress-fill" style="width:'+(idx/words.length*100)+'%"></div></div>'+
        '<div style="padding:16px 20px;text-align:center;font-size:13px;font-weight:600;color:var(--green)">\uD55C \u2192 \uC601</div>'+
        '<div class="quiz-word" style="font-size:22px">'+w.meaning+'</div><div style="height:16px"></div>'+
        '<div class="quiz-options">'+opts2.map(function(o,i){
          return '<button class="quiz-opt" onclick="checkDeep(this,'+(o===w.word)+')"><span class="opt-num">'+(i+1)+'</span>'+o+'</button>'}).join('')+'</div>';
    }else{
      el.innerHTML=
        '<div class="header"><button class="header-back" onclick="endStudySession()">\u2190</button>'+
          '<div class="header-title">\uC2EC\uD654\uD559\uC2B5</div><div class="header-right" style="font-size:13px;color:var(--sub)">'+(idx+1)+'/'+words.length+'</div></div>'+
        '<div class="test-progress"><div class="test-progress-fill" style="width:'+(idx/words.length*100)+'%"></div></div>'+
        '<div style="padding:16px 20px;text-align:center;font-size:13px;font-weight:600;color:var(--red)">\uCCA0\uC790 \uC4F0\uAE30</div>'+
        '<div style="text-align:center;font-size:20px;font-weight:700;padding:24px 20px">'+w.meaning+'</div>'+
        '<input class="type-input" id="deep-type" placeholder="\uC601\uC5B4\uB85C \uC785\uB825\uD558\uC138\uC694" autocomplete="off" autocapitalize="off" spellcheck="false">'+
        '<div style="padding:12px 20px"><button class="btn btn-primary btn-sm" onclick="checkDeepType(\''+w.word.replace(/'/g,"\\'")+'\')">\uD655\uC778</button></div>';
      setTimeout(function(){var inp=document.getElementById('deep-type');if(inp)inp.focus()},100);
    }
  }

  window.checkDeep=function(btn,isCorrect){
    if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
    if(isCorrect){btn.classList.add('correct');playCorrect();haptic('correct');correct++}
    else{btn.classList.add('wrong');playWrong();haptic('wrong')}
    setTimeout(function(){typeIdx++;if(typeIdx>=types.length){typeIdx=0;idx++}render()},isCorrect?500:1500);
  };

  window.checkDeepType=function(answer){
    var inp=document.getElementById('deep-type');if(!inp)return;
    if(inp.value.trim().toLowerCase()===answer.toLowerCase()){inp.classList.add('correct');playCorrect();haptic('correct');correct++}
    else{inp.classList.add('wrong');playWrong();haptic('wrong');inp.value=answer}
    setTimeout(function(){typeIdx=0;idx++;render()},1000);
  };

  function renderMatching(){
    var matchWords=words.slice(Math.max(0,idx-8),idx).slice(0,8);
    if(matchWords.length<4){idx++;typeIdx=0;render();return}
    var pairs=matchWords.slice(0,Math.min(8,matchWords.length));
    var enCards=shuffle(pairs.map(function(w){return{id:w.num,text:w.word,type:'en'}}));
    var krCards=shuffle(pairs.map(function(w){return{id:w.num,text:w.meaning.length>15?w.meaning.slice(0,15)+'...':w.meaning,type:'kr'}}));
    var allCards=shuffle(enCards.concat(krCards));
    var selected=null,matched=0;var total=pairs.length;

    el.innerHTML=
      '<div class="header"><button class="header-back" onclick="endStudySession()">\u2190</button>'+
        '<div class="header-title">\uB9E4\uCE6D \uAC8C\uC784</div><div class="header-right" style="font-size:13px;color:var(--sub)">'+matched+'/'+total+'</div></div>'+
      '<div style="padding:12px 20px;text-align:center;font-size:14px;color:var(--sub)">\uC601\uC5B4-\uD55C\uAD6D\uC5B4 \uC9DD\uC744 \uB9DE\uCD94\uC138\uC694</div>'+
      '<div class="match-grid" id="match-grid">'+allCards.map(function(c,i){
        return '<button class="match-cell" data-id="'+c.id+'" data-type="'+c.type+'" data-idx="'+i+'" onclick="selectMatch(this)">'+c.text+'</button>'}).join('')+'</div>';

    window.selectMatch=function(cell){
      if(cell.classList.contains('matched'))return;
      if(!selected){selected=cell;cell.classList.add('selected');playClick();haptic('click');return}
      if(selected===cell){selected.classList.remove('selected');selected=null;return}
      if(selected.dataset.id===cell.dataset.id&&selected.dataset.type!==cell.dataset.type){
        selected.classList.remove('selected');selected.classList.add('matched');cell.classList.add('matched');
        playCorrect();haptic('correct');matched++;correct++;selected=null;
        el.querySelector('.header-right').textContent=matched+'/'+total;
        if(matched===total)setTimeout(function(){render()},500)}
      else{cell.classList.add('wrong');selected.classList.add('wrong');playWrong();haptic('wrong');
        var s=selected;setTimeout(function(){s.classList.remove('selected','wrong');cell.classList.remove('wrong')},500);selected=null}
    };
  }

  function endDeep(){
    var score=Math.round(correct/(words.length*4)*100);
    addXp(correct*2);addHistory('deep',studySelectedUnits.map(function(u){return u+'\uACFC'}).join(','),score);
    el.innerHTML='<div class="result-hero"><div style="font-size:48px;margin-bottom:16px">\uD83D\uDCDD</div>'+
      '<div style="font-size:28px;font-weight:800">\uC2EC\uD654\uD559\uC2B5 \uC644\uB8CC!</div>'+
      '<div style="font-size:16px;color:var(--sub);margin-top:8px">\uC815\uB2F5\uB960: '+score+'%</div></div>'+
      '<div style="padding:20px"><button class="btn btn-primary" onclick="showStudySub(\'study-select\')">\uB3CC\uC544\uAC00\uAE30</button></div>';
  }

  showStudySub('study-session');render();updateStreak();logStudy(studySelectedUnits);
}

        '<div class="header-title" style="font-size:14px;color:var(--sub)">'+(idx+1)+' / '+words.length+'</div>'+
        '<div class="header-right"></div></div>'+
      '<div class="timer-bar-wrap"><div class="timer-bar-fill" id="test-timer-bar" style="width:100%"></div></div>'+
      '<div class="quiz-word">'+w.word+'</div>'+
      (w.pronunciation?'<div class="quiz-pron">'+w.pronunciation+'</div>':'')+
      '<div class="quiz-speaker" onclick="speak(\''+w.word.replace(/'/g,"\\'")+'\')">\uD83D\uDD0A</div>'+
      '<div class="quiz-options" id="test-opts">'+options.map(function(o,i){
        var isC=o===w.meaning;
        return '<button class="quiz-opt" data-correct="'+(isC?'1':'0')+'" data-answer="'+encodeURIComponent(w.meaning)+'" onclick="checkTestAnswer(this,this.dataset.correct===\'1\',decodeURIComponent(this.dataset.answer))">'+
          '<span class="opt-num">'+(i+1)+'</span><span>'+o+'</span></button>'}).join('')+'</div>';
    speak(w.word);

    // 3-second timer
    clearInterval(timerRef);
    var elapsed=0;
    timerRef=setInterval(function(){
      elapsed+=50;
      var pct=100-elapsed/3000*100;
      var bar=document.getElementById('test-timer-bar');
      if(bar){
        bar.style.width=Math.max(0,pct)+'%';
        bar.className='timer-bar-fill'+(pct<33?' danger':pct<66?' warn':'');
      }
      if(elapsed>=3000){
        clearInterval(timerRef);
        // Timeout = wrong
        answers.push({word:w.word,meaning:w.meaning,correct:false,num:w.num,unit:w.unit});
        playWrong();haptic('wrong');
        var existing=wrongWords.find(function(x){return x.word===w.word});
        if(existing)existing.count++;else wrongWords.push({word:w.word,meaning:w.meaning,count:1,num:w.num,unit:w.unit});
        saveAll();
        // Show correct answer
        document.querySelectorAll('#test-opts .quiz-opt').forEach(function(o){
          if(o.querySelector('span:last-child').textContent===w.meaning)o.classList.add('show-correct')});
        setTimeout(function(){idx++;if(idx<words.length)renderQ();else showResult()},1500);
      }
    },50);
  }

  window.checkTestAnswer=function(btn,isCorrect,correctAns){
    if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
    clearInterval(timerRef);
    var w=words[idx];
    answers.push({word:w.word,meaning:w.meaning,correct:isCorrect,num:w.num,unit:w.unit});

    if(isCorrect){
      btn.classList.add('correct');playCorrect();haptic('correct');correct++;
      setTimeout(function(){idx++;if(idx<words.length)renderQ();else showResult()},500);
    }else{
      btn.classList.add('wrong');playWrong();haptic('wrong');
      btn.parentElement.querySelectorAll('.quiz-opt').forEach(function(o){
        if(o.querySelector('span:last-child').textContent===correctAns)o.classList.add('show-correct')});
      var existing=wrongWords.find(function(x){return x.word===w.word});
      if(existing)existing.count++;else wrongWords.push({word:w.word,meaning:w.meaning,count:1,num:w.num,unit:w.unit});
      saveAll();
      setTimeout(function(){idx++;if(idx<words.length)renderQ();else showResult()},1500);
    }
  };

  window.confirmEndTest=function(){
    clearInterval(timerRef);
    document.getElementById('confirm-modal').style.display='flex';
    document.getElementById('confirm-body').innerHTML=
      '<div style="font-size:18px;font-weight:700;margin-bottom:8px">\uC2DC\uD5D8\uC744 \uC885\uB8CC\uD560\uAE4C\uC694?</div>'+
      '<div style="font-size:14px;color:var(--sub);margin-bottom:20px">\uC9C4\uD589 \uC911\uC778 \uC2DC\uD5D8 \uACB0\uACFC\uB294 \uC800\uC7A5\uB418\uC9C0 \uC54A\uC544\uC694</div>'+
      '<div style="display:flex;gap:8px">'+
        '<button class="btn btn-ghost btn-sm" style="flex:1" onclick="closeConfirm()">\uACC4\uC18D\uD558\uAE30</button>'+
        '<button class="btn btn-danger btn-sm" style="flex:1" onclick="closeConfirm();endTestNow()">\uC885\uB8CC\uD558\uAE30</button></div>';
  };

  window.endTestNow=function(){
    clearInterval(timerRef);
    inTest=false;
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('disabled')});
    renderTestSetup();
  };

  function showResult(){
    clearInterval(timerRef);
    inTest=false;
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('disabled')});
    var score=Math.round(correct/words.length*100);
    var passed=score>=80;
    updateStreak();

    testSelectedUnits.forEach(function(u){
      if(!unitScores[u])unitScores[u]={best:0,passed:false,attempts:0};
      unitScores[u].attempts++;
      if(score>unitScores[u].best)unitScores[u].best=score;
      if(passed)unitScores[u].passed=true;
    });

    addXp(passed?50:20);
    addHistory('test',testSelectedUnits.map(function(u){return u+'\uACFC'}).join(','),score);
    logStudy(testSelectedUnits);saveAll();

    var wrongOnes=answers.filter(function(a){return !a.correct});

    // Save to Supabase
    saveTestResult(testSelectedUnits,score,words.length,correct,passed,
      wrongOnes.map(function(w){return{word:w.word,meaning:w.meaning}}));

    // Homework auto-complete
    if(passed){
      showConfetti();playPass();
      autoCompleteHomework(testSelectedUnits,score);
    }

    // Invalidate ranking cache
    rankingCache=null;

    var resEl=document.getElementById('test-result');
    document.querySelectorAll('#page-test .sub-page').forEach(function(p){p.classList.remove('active')});
    resEl.classList.add('active');

    var circumference=Math.PI*2*60;
    var offset=circumference*(1-score/100);
    var scoreColor=score>=80?'var(--green)':score>=60?'var(--yellow)':'var(--red)';

    resEl.innerHTML=
      '<div class="result-hero">'+
        '<div style="font-size:40px;margin-bottom:8px">'+(passed?'\uD83C\uDF89':'\uD83D\uDCAA')+'</div>'+
        '<div style="font-size:18px;font-weight:700;color:var(--sub);margin-bottom:24px">'+(passed?'\uCD95\uD558\uD574\uC694! \uD1B5\uACFC\uD588\uC5B4\uC694':'\uB2E4\uC74C\uC5D4 \uD560 \uC218 \uC788\uC5B4\uC694')+'</div>'+
        '<div class="result-circle">'+
          '<svg width="160" height="160">'+
            '<circle cx="80" cy="80" r="60" fill="none" stroke="var(--g200)" stroke-width="8"/>'+
            '<circle cx="80" cy="80" r="60" fill="none" stroke="'+scoreColor+'" stroke-width="8"'+
              ' stroke-dasharray="'+circumference+'" stroke-dashoffset="'+circumference+'" stroke-linecap="round"'+
              ' style="transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.5s var(--ease)"'+
              ' id="score-circle"/></svg>'+
          '<div class="score-text">'+
            '<div class="result-score" id="score-num" style="color:'+scoreColor+'">0</div>'+
            '<div class="result-label">\uC810</div></div></div>'+
        (passed?'<div style="margin-top:8px;font-size:16px;font-weight:700;color:var(--blue);animation:badgeIn .3s var(--ease-spring)">+50 XP</div>':'')+
        '<div style="margin-top:12px;font-size:14px;color:var(--sub)">'+correct+'/'+words.length+' \uC815\uB2F5</div></div>'+
      (wrongOnes.length?
        '<div class="sec-label">\uD2C0\uB9B0 \uB2E8\uC5B4 ('+wrongOnes.length+'\uAC1C)</div>'+
        '<div class="card card-sm" style="max-height:200px;overflow-y:auto">'+
          wrongOnes.map(function(w){return '<div class="wrong-item"><div class="wrong-dot" style="background:var(--red)"></div>'+
            '<div class="wrong-word">'+w.word+'</div><div class="wrong-meaning">'+w.meaning+'</div></div>'}).join('')+'</div>':'')+
      '<div style="padding:16px 20px;display:flex;flex-direction:column;gap:8px">'+
        (wrongOnes.length?'<button class="btn btn-secondary" onclick="startWrongReview('+JSON.stringify(wrongOnes.map(function(w){return w.num}))+')">\uD2C0\uB9B0 '+wrongOnes.length+'\uAC1C \uBCF5\uC2B5</button>':'')+
        '<button class="btn btn-primary" onclick="renderTestSetup()">\uB2E4\uC2DC \uC2DC\uD5D8\uBCF4\uAE30</button>'+
        '<button class="btn btn-ghost" onclick="switchTab(\'home\')">\uD648\uC73C\uB85C</button></div>';

    setTimeout(function(){
      var circleEl=document.getElementById('score-circle');
      if(circleEl)circleEl.style.strokeDashoffset=offset;
      var current=0,target=score,start=Date.now();
      (function anim(){
        var elapsed=Date.now()-start;var progress=Math.min(elapsed/1500,1);
        current=Math.round(target*progress);
        var numEl=document.getElementById('score-num');if(numEl)numEl.textContent=current;
        if(progress<1)requestAnimationFrame(anim);
      })();
    },100);
  }

  renderQ();updateStreak();
}

/* ━━ STATS TAB ━━ */
function renderStats(){
  var allWords=VOCAB_DATA.filter(function(w){return w.unit>0});
  var mastered=allWords.filter(function(w){return wordStates[w.num]&&wordStates[w.num].level>=2}).length;
  var learning=allWords.filter(function(w){return wordStates[w.num]&&wordStates[w.num].level===1}).length;
  var unseen=allWords.length-mastered-learning;
  var masteredPct=Math.round(mastered/allWords.length*100);

  var dayNames=['\uC6D4','\uD654','\uC218','\uBAA9','\uAE08','\uD1A0','\uC77C'];
  var now=new Date();
  var heatHtml='';
  for(var i=6;i>=0;i--){
    var d=new Date(now);d.setDate(d.getDate()-i);
    var ds=d.toISOString().slice(0,10);
    var hasStudy=studyLog[ds]&&studyLog[ds].length>0;
    var dayIdx=(d.getDay()+6)%7;
    heatHtml+='<div class="heat-cell '+(hasStudy?'filled':'empty')+'">'+dayNames[dayIdx]+'</div>';
  }

  var barHtml='';
  for(var u=1;u<=40;u++){
    var us=unitScores[u];
    if(!us)continue;
    var pctBar=us.best;
    var color=pctBar>=80?'var(--green)':pctBar>=60?'var(--yellow)':'var(--red)';
    barHtml+='<div class="bar-row"><div class="bar-label">'+u+'\uACFC</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pctBar+'%;background:'+color+'"></div></div>'+
      '<div style="font-size:12px;font-weight:600;width:36px;color:'+color+'">'+pctBar+'%</div></div>';
  }

  var weakWords=wrongWords.slice().sort(function(a,b){return b.count-a.count}).slice(0,5);
  var circum=Math.PI*2*45;

  document.getElementById('stats-content').innerHTML=
    '<div class="card" style="text-align:center">'+
      '<div style="font-size:15px;font-weight:700;margin-bottom:16px">\uC804\uCCB4 \uD559\uC2B5 \uD604\uD669</div>'+
      '<div style="position:relative;width:120px;height:120px;margin:0 auto">'+
        '<svg width="120" height="120">'+
          '<circle cx="60" cy="60" r="45" fill="none" stroke="var(--g200)" stroke-width="10"/>'+
          '<circle cx="60" cy="60" r="45" fill="none" stroke="var(--green)" stroke-width="10"'+
            ' stroke-dasharray="'+circum+'" stroke-dashoffset="'+circum*(1-mastered/allWords.length)+'"'+
            ' stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:center"/></svg>'+
        '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
          '<div style="font-size:24px;font-weight:900;color:var(--green)">'+masteredPct+'%</div>'+
          '<div style="font-size:11px;color:var(--sub)">\uC554\uAE30\uC728</div></div></div>'+
      '<div style="display:flex;justify-content:center;gap:20px;margin-top:16px">'+
        '<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:4px"></span>'+
          '<span style="font-size:13px;font-weight:600">\uC554\uAE30 '+mastered+'</span></div>'+
        '<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:4px"></span>'+
          '<span style="font-size:13px;font-weight:600">\uD559\uC2B5 '+learning+'</span></div>'+
        '<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g300);margin-right:4px"></span>'+
          '<span style="font-size:13px;font-weight:600">\uBBF8\uD559\uC2B5 '+unseen+'</span></div></div></div>'+

    '<div class="sec-label">\uC774\uBC88 \uC8FC \uD559\uC2B5</div>'+
    '<div class="card card-sm"><div class="heatmap">'+heatHtml+'</div></div>'+

    '<div class="sec-label">\uACFC\uBCC4 \uCD5C\uACE0 \uC810\uC218</div>'+
    '<div class="card card-sm">'+(barHtml||'<div style="text-align:center;color:var(--hint);padding:16px;font-size:14px">\uC544\uC9C1 \uD14C\uC2A4\uD2B8 \uAE30\uB85D\uC774 \uC5C6\uC5B4\uC694</div>')+'</div>'+

    (weakWords.length?'<div class="sec-label">\uCDE8\uC57D \uB2E8\uC5B4 TOP 5</div>'+
    '<div class="card card-sm">'+weakWords.map(function(w){
      return '<div class="wrong-item"><div class="wrong-dot" style="background:var(--red)"></div>'+
        '<div class="wrong-word">'+w.word+'</div><div class="wrong-meaning">'+w.meaning+'</div>'+
        '<div class="wrong-count">'+w.count+'\uD68C</div></div>'}).join('')+'</div>':'')+

    '<div class="card" style="display:flex;justify-content:space-around;text-align:center">'+
      '<div><div style="font-size:24px;font-weight:900;color:var(--orange)">\uD83D\uDD25 '+streak.count+'</div><div style="font-size:12px;color:var(--sub)">\uC5F0\uC18D\uC77C</div></div>'+
      '<div><div style="font-size:24px;font-weight:900">'+(mastered+learning)+'</div><div style="font-size:12px;color:var(--sub)">\uD559\uC2B5 \uB2E8\uC5B4</div></div>'+
      '<div><div style="font-size:24px;font-weight:900">'+Object.keys(unitScores).length+'</div><div style="font-size:12px;color:var(--sub)">\uD14C\uC2A4\uD2B8 \uACFC</div></div></div>'+
    '<div style="height:24px"></div>';
}

function resetAll(){
  var keys=['wordStates','unitScores','wrongWords','bookmarks','streak','xp','studyLog','settings','history','onboarded'];
  keys.forEach(function(k){localStorage.removeItem('vm_'+k)});
  closeConfirm();location.reload();
}

/* ━━ INIT ━━ */
function init(){
  initOnboard();
  if(paramMode==='test'){switchTab('test')}
  else if(paramUnits){
    var units=paramUnits.split(',').map(Number).filter(function(n){return n>=0&&n<=40});
    if(units.length){testSelectedUnits=units;switchTab('test')}
    else switchTab('home');
  }else if(paramUnit){
    var u=parseInt(paramUnit);
    if(u>=0&&u<=40){testSelectedUnits=[u];switchTab('test')}
    else switchTab('home');
  }else switchTab('home');
}

init();

</script>
