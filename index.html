function retryVocaWrong(){
  haptic('tap');
  const wrongWords=VS.wrongList.map(w=>w.word);
  const allWords=VOCAB_DATA.filter(w=>w.unit>0);
  VS.qs=wrongWords.map((w,i)=>{
    const pool=wrongWords.length>=4?wrongWords:allWords;
    if(VS.mode==='spelling'){
      return{idx:i,word:w,choices:null,correct:w.word};
    }else{
      const choices=genVocabChoices(w,pool,VS.mode);
      const correctAns=VS.mode==='eng2kr'?getShortMeaning(w.meaning):w.word;
      return{idx:i,word:w,choices,correct:correctAns};
    }
  });
  VS.qs=shuffleArr(VS.qs);
  VS.ci=0;VS.ans={};VS.score=0;VS.wrongList=[];
  S.scr='vocatest';S.dir='fwd';R();
}


function R(){({login:rLogin,home:rHome,learn:rLearn,record:rRecord,my:rMy,select:rSel,settings:rSet,exam:rExam,result:rResult,speedquiz:rSpeedQuiz,flashcard:rFlashcard,runnergame:rRunnerGame,survey:rSurvey,zoomprep:rZoomPrep,zoomhub:rZoomHub,vocabhub:rVocabHub,vocaflash:rVocaFlash,vocamode:rVocaMode,vocatest:rVocaTest,vocaresult:rVocaResult}[S.scr]||rLogin)();
  // Apply page transition direction
  const pg=app.querySelector('.page');if(pg&&S.dir){pg.classList.remove('slide-left','slide-right','tab-swap');if(S.dir==='back')pg.classList.add('slide-right');else if(S.dir==='fwd')pg.classList.add('slide-left');else if(S.dir==='tab')pg.classList.add('tab-swap');}S.dir='fwd';
  // Tab bar visibility
  const tabScreens=['home','learn','record','my'];
  const tb=$('tabBar');
  if(tabScreens.includes(S.scr)){tb.style.display='';document.querySelectorAll('.tab-item').forEach(t=>{t.classList.toggle('active',t.id==='tab_'+S.scr);});
    // Instant reveal + count-up for tab pages
    applyCountUps();
  }else{tb.style.display='none';}}
function switchTab(tab){if(S.scr===tab)return;haptic('tap');S.scr=tab;S.dir='tab';R();
  // Tab bounce animation
  const ti=$('tab_'+tab);if(ti){ti.classList.remove('tab-bounce');void ti.offsetWidth;ti.classList.add('tab-bounce');ti.addEventListener('animationend',()=>ti.classList.remove('tab-bounce'),{once:true});}
  // Instant reveal for cards
  applyCountUps();
}

// ━━ Count-up Animation ━━
function countUp(el,target,duration=400){
  if(!el)return;const start=performance.now();const from=0;
  function step(now){const p=Math.min((now-start)/duration,1);const eased=1-Math.pow(1-p,3);// easeOutCubic
  el.textContent=Math.round(from+(target-from)*eased);if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
// Apply count-up to elements with data-count attribute
function applyCountUps(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseInt(el.getAttribute('data-count'));
    if(!isNaN(target))countUp(el,target);
  });
}

let newsCache={items:[],fetched:0};
async function fetchNews(){
  if(Date.now()-newsCache.fetched<600000&&newsCache.items.length)return newsCache.items;
  try{
    const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://news.google.com/rss/search?q=수능영어+OR+내신영어&hl=ko&gl=KR&ceid=KR:ko');
    const res=await fetch(url);
    const data=await res.json();
    if(data.status==='ok'&&data.items){
      const filtered=data.items.filter(it=>{
        const t=it.title.toLowerCase();
        return t.includes('영어')||t.includes('수능')||t.includes('내신')||t.includes('입시')||t.includes('모의고사');
      }).slice(0,6);
      newsCache={items:filtered,fetched:Date.now()};
      return filtered;
    }
  }catch(e){}
  return newsCache.items;
}
function renderNewsSection(){
  const el=document.getElementById('newsArea');
  if(!el)return;
  fetchNews().then(items=>{
    if(!items.length){el.innerHTML='<div style="text-align:center;padding:16px;font-size:13px;color:var(--hint)">뉴스를 불러오는 중...</div>';return;}
    el.innerHTML=items.map(it=>{
      const d=new Date(it.pubDate);
      const dateStr=(d.getMonth()+1)+'/'+d.getDate();
      const title=it.title.replace(/ - .*$/,'');
      return `<button onclick="window.open('${it.link}','_blank')" style="width:100%;padding:14px 0;border:none;background:none;display:flex;align-items:flex-start;gap:12px;cursor:pointer;text-align:left;border-bottom:1px solid var(--divider)">

      </button>`;
    }).join('');
  });
}

function getWeekRange(){
  const now=new Date();const day=now.getDay();const diff=now.getDate()-day+(day===0?-6:1);
  const mon=new Date(now.getFullYear(),now.getMonth(),diff);mon.setHours(0,0,0,0);
  const fri=new Date(mon);fri.setDate(fri.getDate()+4);
  const dayNames=['일','월','화','수','목','금','토'];
  return `${mon.getMonth()+1}/${mon.getDate()}(${dayNames[mon.getDay()]}) ~ ${fri.getMonth()+1}/${fri.getDate()}(${dayNames[fri.getDay()]})`;
}
function getSurveyHistory(){try{return JSON.parse(localStorage.getItem('el_survey_history'))||[];}catch(e){return[];}}
async function saveSurveyEntry(entry){
  const h=getSurveyHistory();h.push(entry);
  try{localStorage.setItem('el_survey_history',JSON.stringify(h.slice(-50)));}catch(e){}
  // Save to Supabase (delete existing this week first, then insert)
  if(supa){
    const now=new Date();const dow=now.getDay();
    const isWeekend=dow===0||dow===6;
    const daysUntilMon=isWeekend?(dow===0?1:2):(1-dow);
    const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()+daysUntilMon);
    mon.setHours(0,0,0,0);
    const weekStart=mon.toISOString();
    await supa.from('zoom_surveys').delete()
      .eq('name',entry.name)
      .eq('teacher',entry.teacher)
      .gte('created_at',weekStart);
    supa.from('zoom_surveys').insert({
      name:entry.name,
      school:entry.school,
      grade:entry.grade,
      curriculum:entry.curriculum,
      teacher:entry.teacher,
      week:entry.week,
      day:entry.day
    }).then(({error})=>{if(error)console.error('Supabase error:',error);});
  }
}
function getThisWeekSurvey(){
  const h=getSurveyHistory();if(!h.length)return null;
  const now=new Date();const day=now.getDay();const diff=now.getDate()-day+(day===0?-6:1);
  const weekStart=new Date(now.getFullYear(),now.getMonth(),diff);weekStart.setHours(0,0,0,0);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
  return h.filter(e=>e.timestamp>=weekStart.getTime()&&e.timestamp<weekEnd.getTime()).pop()||null;
}
async function fetchSurveyAvail(teacher){
  if(!supa)return;
  // 월~금: 이번 주 기준, 토~일: 다음 주 기준
  const now=new Date();const dow=now.getDay();
  const isWeekend=dow===0||dow===6;
  // 토~일: 다음 주 월요일, 월~금: 이번 주 월요일
  const daysUntilMon=isWeekend?(dow===0?1:2):(1-dow);
  const targetMon=new Date(now.getFullYear(),now.getMonth(),now.getDate()+daysUntilMon);
  targetMon.setHours(0,0,0,0);
  const thisWeekStart=targetMon.getFullYear()+'-'+String(targetMon.getMonth()+1).padStart(2,'0')+'-'+String(targetMon.getDate()).padStart(2,'0');
  surveyAvail={unavailable:[],max:9,counts:{},loading:false,daySlots:null};
  try{
    const[schedRes,countRes]=await Promise.all([
      supa.from('teacher_schedule').select('*').eq('teacher',teacher).eq('week_start',thisWeekStart).maybeSingle(),
      supa.from('zoom_surveys').select('day').eq('teacher',teacher).gte('created_at',targetMon.toISOString())
    ]);
    if(schedRes.data){
      surveyAvail.unavailable=schedRes.data.unavailable_days||[];
      surveyAvail.max=schedRes.data.max_per_day||9;
      if(schedRes.data.day_slots)surveyAvail.daySlots=schedRes.data.day_slots;
    }
    const counts={};
    (countRes.data||[]).forEach(r=>{
      const m=r.day.match(/^([\uAC00-\uD7AF])/);
      if(m)counts[m[1]]=(counts[m[1]]||0)+1;
    });
    surveyAvail.counts=counts;
  }catch(e){console.error('fetchSurveyAvail error',e);}
  R();
}

// ━━ Score Trend Chart ━━
function renderTrendChart(){
  const el=document.getElementById('trendChart');if(!el)return;
  const hist=gH();if(hist.length<2)return;

  const W=340,H=180,padL=32,padR=16,padT=20,padB=28;
  const scores=hist.map(r=>r.score);
  const minS=Math.max(0,Math.min(...scores)-10),maxS=Math.min(100,Math.max(...scores)+10);
  const rangeS=maxS-minS||1;
  const n=scores.length;

  const chartW=W-padL-padR,chartH=H-padT-padB;
  const pts=scores.map((s,i)=>{
    const x=padL+(n>1?i/(n-1):0.5)*chartW;
    const y=padT+chartH-(s-minS)/rangeS*chartH;
    return{x,y,s};
  });

  const pathD=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(' ');
  const areaD=pathD+` L${pts[pts.length-1].x},${padT+chartH} L${pts[0].x},${padT+chartH} Z`;

  const bestIdx=scores.indexOf(Math.max(...scores));

  // Grid lines
  const gridCount=4;
  let gridLines='';
  for(let i=0;i<=gridCount;i++){
    const val=Math.round(minS+(maxS-minS)*i/gridCount);
    const y=padT+chartH-((val-minS)/rangeS)*chartH;
    gridLines+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" class="trend-grid"/>`;
    gridLines+=`<text x="${padL-6}" y="${y+1}" class="trend-label" text-anchor="end">${val}</text>`;
  }

  // Date labels (first and last)
  let dateLabels='';
  if(hist.length>=2){
    dateLabels+=`<text x="${pts[0].x}" y="${H-4}" class="trend-label" text-anchor="start">${hist[0].date?.replace(/\d{4}\.\s*/,'').replace(/\./g,'/')||''}</text>`;
    dateLabels+=`<text x="${pts[pts.length-1].x}" y="${H-4}" class="trend-label" text-anchor="end">${hist[hist.length-1].date?.replace(/\d{4}\.\s*/,'').replace(/\./g,'/')||''}</text>`;
  }

  let svg=`<svg class="trend-svg" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
    ${gridLines}
    <path d="${areaD}" class="trend-area"/>
    <path d="${pathD}" class="trend-line"/>
    ${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===pts.length-1||i===bestIdx?5:3}" class="trend-dot${i===bestIdx?' best':''}"/>${i===pts.length-1||i===bestIdx?`<text x="${p.x}" y="${p.y-10}" class="trend-score-label" text-anchor="middle">${p.s}</text>`:''}`).join('')}
    ${dateLabels}
  </svg>`;

  el.innerHTML=svg;
}

// ━━ Instagram Share Card Generator ━━
function generateInstaCard(){
  const hist=gH();const p=profile;const sk=checkStreak();const xd=getXP();
  const scores=hist.map(r=>r.score);
  const latest=scores.length?scores[scores.length-1]:0;
  const first=scores.length?scores[0]:0;
  const best=scores.length?Math.max(...scores):0;
  const diff=latest-first;
  const totalTests=hist.length;

  const W=1080,H=1920,sc=1;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');

  // Helpers
  function rr(x,y,w,h,rad){c.beginPath();c.moveTo(x+rad,y);c.lineTo(x+w-rad,y);c.quadraticCurveTo(x+w,y,x+w,y+rad);c.lineTo(x+w,y+h-rad);c.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);c.lineTo(x+rad,y+h);c.quadraticCurveTo(x,y+h,x,y+h-rad);c.lineTo(x,y+rad);c.quadraticCurveTo(x,y,x+rad,y);c.closePath();}
  function fillRR(x,y,w,h,rad,color){rr(x,y,w,h,rad);c.fillStyle=color;c.fill();}

function generateZoomPrepQuestions(){
  const words=[...DAILY_WORDS];shuffle(words);
  const qs=[];
  let id=1;

  // Helper: generate 4 wrong choices from DAILY_WORDS
  function wrongChoices(correct,field,n){
    const others=DAILY_WORDS.filter(x=>x.en!==correct.en);shuffle(others);
    return others.slice(0,n).map(x=>x[field]);
  }

  // Q1-6: Simple en<->ko matching (4pts each)
  for(let i=0;i<6;i++){
    const w=words[i];
    const isEnToKo=i%2===0;
    const wrongs=wrongChoices(w,isEnToKo?'ko':'en',3);
    const choices=isEnToKo?[w.ko,...wrongs]:[w.en,...wrongs];
    shuffle(choices);
    const ansIdx=choices.indexOf(isEnToKo?w.ko:w.en);
    qs.push({
      id:id++,type:'어휘',diff:'쉬움',pts:4,fmt:'mc',
      stem:isEnToKo?'다음 영어 단어의 뜻으로 알맞은 것은?<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-size:18px;font-weight:700;text-align:center">'+w.en+'</div>':'다음 한국어 뜻에 해당하는 영어 단어는?<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-size:18px;font-weight:700;text-align:center">'+w.ko+'</div>',
      ch:choices.map((c,ci)=>''+['①','②','③','④'][ci]+' '+c),ans:ansIdx,
      det:{correct:'정답: '+(isEnToKo?w.ko:w.en)+' ('+w.en+' = '+w.ko+')',tip:'수능 필수 어휘를 반복 암기하세요.'}
    });
  }

  // Q7-14: Fill in the blank / synonym-antonym (5pts each)
  const contextTemplates=[
    {t:'다음 빈칸에 들어갈 단어로 가장 적절한 것은?',gen:(w)=>'The government decided to _____ the new policy despite public opposition.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600">빈칸에 "'+w.ko+'"의 의미를 가진 단어를 고르시오.</div>'},
    {t:'다음 빈칸에 들어갈 단어로 가장 적절한 것은?',gen:(w)=>'Scientists have been trying to _____ the effects of climate change on marine ecosystems.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600">빈칸에 "'+w.ko+'"의 의미를 가진 단어를 고르시오.</div>'},
    {t:'다음 빈칸에 들어갈 단어로 가장 적절한 것은?',gen:(w)=>'It is important to _____ different perspectives before making a final decision.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-weight:600">빈칸에 "'+w.ko+'"의 의미를 가진 단어를 고르시오.</div>'},
    {t:'다음 단어와 가장 의미가 가까운 것은?',gen:(w)=>'<div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-size:18px;font-weight:700;text-align:center">'+w.en+'</div><div style="font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px">('+w.ko+')</div>위 단어와 가장 의미가 가까운 것을 고르시오.'},
  ];
  for(let i=0;i<8;i++){
    const w=words[6+i];
    const tmpl=contextTemplates[i%contextTemplates.length];
    const wrongs=wrongChoices(w,'en',3);
    const choices=[w.en,...wrongs];shuffle(choices);
    const ansIdx=choices.indexOf(w.en);
    qs.push({
      id:id++,type:'구문독해',diff:'보통',pts:5,fmt:'mc',
      stem:tmpl.gen(w),
      ch:choices.map((c,ci)=>''+['①','②','③','④'][ci]+' '+c),ans:ansIdx,
      det:{correct:'정답: '+w.en+' ('+w.ko+')',tip:'문맥 속에서 단어의 의미를 파악하는 연습을 하세요.'}
    });
  }

  // Q15-20: Hardest — word meaning in context, choose best definition (6pts each)
  for(let i=0;i<6;i++){
    const w=words[14+i];
    const wrongs=wrongChoices(w,'ko',3);
    const choices=[w.ko,...wrongs];shuffle(choices);
    const ansIdx=choices.indexOf(w.ko);
    qs.push({
      id:id++,type:'종합',diff:'어려움',pts:6,fmt:'mc',
      stem:'다음 영어 단어의 뜻으로 가장 적절한 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;font-size:18px;font-weight:700;text-align:center">'+w.en+'</div><div style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:4px">다음 중 가장 정확한 뜻을 선택하시오.</div>',
      ch:choices.map((c,ci)=>''+['①','②','③','④'][ci]+' '+c),ans:ansIdx,
      det:{correct:'정답: '+w.ko+' ('+w.en+' = '+w.ko+')',tip:'수능 고난도 어휘는 정확한 의미 파악이 핵심입니다.'}
    });
  }

  return qs;
}

  const wrongs=getWrong();

  S._isReview=true;
  shuffle(wrongs);
  const total=Math.min(wrongs.length,20);

// ━━ Passage Memorization Question Generator ━━
function generatePassageQuestions(passage){
  if(!passage||!passage.trim())return[];
  // Clean passage: remove extra whitespace
  const clean=passage.replace(/\n+/g,' ').replace(/\s+/g,' ').trim();
  // Split into sentences
  const sentences=clean.match(/[^.!?]+[.!?]+/g)||[clean];
  const questions=[];
  // Key word patterns: 4+ letter words, skip common words
  const skip=new Set(['this','that','these','those','then','than','them','they','their','there','with','from','have','been','were','will','would','could','should','about','after','before','which','where','when','what','into','also','just','like','very','even','only','some','most','many','more','each','your','other','over','such','back','because','between','through','during','without','however','although']);
  let id=1;
  sentences.forEach(sent=>{
    const trimmed=sent.trim();if(trimmed.length<20)return;
    // Find blankable words (4+ chars, not in skip list)
    const words=trimmed.split(/\s+/);
    const candidates=[];
    words.forEach((w,i)=>{
      const cleaned=w.replace(/[^a-zA-Z]/g,'').toLowerCase();
      if(cleaned.length>=4&&!skip.has(cleaned)){candidates.push({word:w,cleanWord:cleaned,idx:i});}
    });
    if(!candidates.length)return;
    // Pick 1-2 words per sentence
    shuffle(candidates);
    const picks=candidates.slice(0,Math.min(2,candidates.length));
    picks.forEach(pick=>{
      // Build sentence with blank
      const blanked=words.map((w,i)=>{
        if(i===pick.idx){
          const punc=w.replace(/[a-zA-Z''-]+/,'');
          return '<b>__________</b>'+punc;
        }
        return w;
      }).join(' ');
      // Extract the actual answer (letters only + apostrophes)
      const ansWord=pick.word.replace(/[^a-zA-Z'''-]/g,'');
      questions.push({
        id:id++,type:'본문 빈칸',diff:'보통',pts:3,fmt:'written',
        passage:`<div style="line-height:2">${blanked}</div>`,
        stem:'다음 본문의 빈칸에 들어갈 단어를 쓰시오.',
        wa:ansWord,
        accept:[ansWord,ansWord.toLowerCase(),ansWord.toUpperCase(),ansWord.charAt(0).toUpperCase()+ansWord.slice(1).toLowerCase()],
        det:{
          ref:'[원문] '+trimmed,
          correct:'정답: '+ansWord,
          tip:'본문을 반복해서 읽고 핵심 단어를 암기하세요.'
        }
      });
    });
  });
  return questions;
}

async function selectTestType(tt){
  S.tt=tt;updateSetUI();
  if(tt==='본문암기'){
    // For passage memorization, fetch all selected lessons' passages and generate questions
    await loadPassageQuestions();
  }else{
    await ensureQuestionsLoaded(tt,S.sel);
  }
  updateSetUI();
}

async function loadPassageQuestions(){
  if(!QUESTION_BANK['본문암기'])QUESTION_BANK['본문암기']={};
  const promises=S.sel.map(async sel=>{
    if(QUESTION_BANK['본문암기'][sel])return;
    // Try to fetch passage from any test type HTML
    const types=['단어테스트','워크북테스트','퀴즈테스트'];
    let passage=null;
    for(const t of types){
      const path='교과서/'+sel+'/'+t+'.html';
      try{
        const resp=await fetch(path);
        if(!resp.ok)continue;
        const html=await resp.text();
        const fpMatch=html.match(/const\s+FULL_PASSAGE\s*=\s*`([\s\S]*?)`;/);
        if(fpMatch){passage=fpMatch[1];break;}
      }catch(e){}
    }
    if(!passage)passage=FALLBACK_FULL_PASSAGE;
    const qs=generatePassageQuestions(passage);
    if(qs.length)QUESTION_BANK['본문암기'][sel]=qs;
  });
  await Promise.all(promises);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function startE(){
  // Free test limit check
  if(!isAcademyUser()&&!S._isDaily&&!S._isReview&&S._challengeName==null){if(!checkTestLimit())return;addFreeCount();}
  // Show skeleton loading
  app.innerHTML=`<div class="page"><div style="padding:20px"><div class="skeleton" style="height:52px;margin-bottom:16px"></div><div class="skeleton" style="height:36px;width:60%;margin-bottom:24px"></div><div class="skeleton" style="height:200px;margin-bottom:12px;border-radius:var(--r-xl)"></div><div class="skeleton" style="height:160px;margin-bottom:12px;border-radius:var(--r-xl)"></div><div class="skeleton" style="height:44px;width:40%;margin-bottom:12px"></div></div></div>`;
  setBottom(null);
  await ensureQuestionsLoaded(S.tt,S.sel);const b=QUESTION_BANK[S.tt]||{};
  // Build per-selection pools
  const groups=[];S.sel.forEach(k=>{if(b[k]&&b[k].length)groups.push(b[k].map(q=>({...q})));});
  if(!groups.length){toast('선택한 범위에 문항이 없어요');return;}
  // Even distribution: base per group + remainder distributed round-robin
  const n=groups.length,total=S.qc;const base=Math.floor(total/n);let rem=total%n;
  let pool=[];groups.forEach(g=>{shuffle(g);const take=Math.min(g.length,base+(rem>0?1:0));if(rem>0)rem--;pool.push(...g.slice(0,take));});
  // If some groups had fewer than quota, fill from remaining
  if(pool.length<total){const used=new Set(pool.map(q=>q.id+'_'+(q.stem||'').slice(0,20)));let extras=[];groups.forEach(g=>g.forEach(q=>{if(!used.has(q.id+'_'+(q.stem||'').slice(0,20)))extras.push(q);}));shuffle(extras);pool.push(...extras.slice(0,total-pool.length));}
  shuffle(pool);S.qs=pool.slice(0,total);S.ans={};S.ci=0;S.scr='exam';S.ts=Date.now();S.te=0;S.tlf=S.tl;if(S.ti)clearInterval(S.ti);S.ti=setInterval(()=>{S.te=Math.floor((Date.now()-S.ts)/1000);S.tlf=Math.max(0,S.tl-S.te);const el=$('tmr');if(el){el.textContent=ft(S.tlf);el.className='timer-display'+(S.tlf<=60?' danger':S.tlf<=300?' warn':'');}if(S.tlf<=0){clearInterval(S.ti);doSub(true);}},1000);R();}

function updateExDot(){

function updateExAc(){const ac=Object.keys(S.ans).length,tot=S.qs.length;const el=$('exAc');if(el)el.textContent=ac+'/'+tot+' 응답';}

// ━━ SUBMIT ━━
function doSub(auto){
  if(!S.qs.length){toast('시험 데이터가 없어요');return;}
  if(!auto){const un=S.qs.length-Object.keys(S.ans).length;if(un>0){const d=document.createElement('div');d.className='modal-overlay';d.id='cm';d.innerHTML=`<div class="modal-box"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div class="t-title">${un}문항이 비어있어요</div><div class="t-caption c-sub" style="margin-top:6px;margin-bottom:24px">빈 문항은 오답으로 처리돼요</div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" style="flex:1" onclick="$('cm').remove()">돌아갈게요</button><button class="btn btn-red btn-sm" style="flex:1" onclick="$('cm').remove();doSub(true)">제출할게요</button></div></div>`;document.body.appendChild(d);return;}}
  if(S.ti)clearInterval(S.ti);
  let tP=0,eP=0,ok=0,no=0,sk=0;const tM={};
  const det=S.qs.map((q,i)=>{tP+=q.pts||0;const a=S.ans[i];let c=false;if(a===undefined||a==='')sk++;else if(q.fmt==='mc')c=a===q.ans;else{const u=String(a).trim().replace(/\s+/g,' ').toLowerCase();if(q.accept)c=q.accept.some(x=>x.trim().replace(/\s+/g,' ').toLowerCase()===u);if(!c&&q.wa)c=u===q.wa.trim().replace(/\s+/g,' ').toLowerCase();}if(c){ok++;eP+=(q.pts||0);}else if(a!==undefined&&a!=='')no++;const t=q.type||'기타';if(!tM[t])tM[t]={total:0,ok:0};tM[t].total++;if(c)tM[t].ok++;return{q,ua:a,ok:c};});
  const score=tP>0?Math.round(eP/tP*100):0;
  S.res={score,ok,no,sk,tP,eP,lv:LV(score),det,tM};S.scr='result';S.rv={};
  sH({date:new Date().toLocaleDateString('ko-KR'),score,ok,no,sk,tP,eP,time:ftk(S.te),type:S.tt,level:LV(score).i+' '+LV(score).n,det,tM});
  if(S._isReview){removeWrongs(det);S._isReview=false;}
  else if(S._isDaily){saveDailyState({date:new Date().toISOString().slice(0,10),completed:true,score});S._isDaily=false;addWrongs(det);autoCheckVocab();}
  else{addWrongs(det);}
  updateStreak();
  // XP, Type Analysis, Badges
  const xpGain=xpFromScore(score,S.qs.length);
  const xpResult=addXP(xpGain);
  addCumType(tM);
  const newBadges=checkBadges();
  S.res.xpGain=xpGain;S.res.xpResult=xpResult;
  haptic('submit');
  R();
  // Animations
  setTimeout(()=>animateScore(score),100);
  if(score>=80)setTimeout(confetti,400);
  // Badge toasts
  if(newBadges.length){let delay=score>=80?1200:800;newBadges.forEach((b,i)=>{setTimeout(()=>showBadgeToast(b),delay+i*2500);});}

  // ━━ Supabase 점수 자동 저장 + 숙제 자동 완료 ━━
  if(supa && profile.name){
    const sid = new URLSearchParams(location.search).get('sid');
    // 줌테스트 결과를 tests 테이블에 저장
    if(sid){
      supa.from('tests').insert({
        student_id: sid,
        date: new Date().toISOString().split('T')[0],
        score: score,
        scheduled: false,
        memo: S.tt + ' (' + ok + '/' + S.qs.length + ')',
        test_name: S.tt
      }).then(r=>{if(r.error)console.log('test save error:',r.error.message);});
      // 숙제 자동 완료
      fetch("https://yhg-home.vercel.app/api/sync-homework",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({student_id:sid,date:new Date().toISOString().split('T')[0]})
      }).catch(()=>{});
    }
  }
}

// ━━ IMAGE ━━
function svImg(){
  const r=S.res,p=profile,l=r.lv,pass=r.score>=80;
  const W=800,sc=2,pad=40,cw=W-pad*2;

  // ── Pre-calculate total height
  const typeCount=Object.keys(r.tM).length;
  const qCount=r.det.length;
  const totalH=40+180+20+160+20+70+20+90+20+(50+typeCount*36)+20+(50+qCount*32)+40+30;

  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=totalH*sc;
  const c=cv.getContext('2d');c.scale(sc,sc);

  // Helpers
  function rr(x,y,w,h,rad){c.beginPath();c.moveTo(x+rad,y);c.lineTo(x+w-rad,y);c.quadraticCurveTo(x+w,y,x+w,y+rad);c.lineTo(x+w,y+h-rad);c.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);c.lineTo(x+rad,y+h);c.quadraticCurveTo(x,y+h,x,y+h-rad);c.lineTo(x,y+rad);c.quadraticCurveTo(x,y,x+rad,y);c.closePath();}
  function fillRR(x,y,w,h,rad,color){rr(x,y,w,h,rad);c.fillStyle=color;c.fill();}
  function txt(text,x,y,size,weight,color,align){c.font=weight+' '+size+'px "Noto Sans KR",sans-serif';c.fillStyle=color;c.textAlign=align||'left';c.textBaseline='middle';c.fillText(text,x,y);}
  function bar(x,y,w,h,pct,bg,fg){fillRR(x,y,w,h,h/2,bg);if(pct>0)fillRR(x,y,Math.max(w*Math.min(pct/100,1),h),h,h/2,fg);}

  // ── Background
  c.fillStyle='#F2F4F6';c.fillRect(0,0,W,totalH);

// ━━ Challenge System ━━
function getChallenge(){try{const u=new URLSearchParams(location.search);
  if(u.get('mode')==='sq')return{mode:'sq',name:u.get('name')||'',score:parseInt(u.get('score'))||0};
  if(u.get('mode')==='run')return{mode:'run',name:u.get('name')||'',score:parseInt(u.get('score'))||0};
  if(!u.has('sel'))return null;return{sel:u.get('sel'),tt:u.get('tt')||'단어테스트',qc:parseInt(u.get('qc'))||20,name:u.get('name')||'',score:parseInt(u.get('score'))||0};}catch(e){return null;}}

function isAcademyUser(){return!!localStorage.getItem('el_academy');}
function getFreeCount(){return parseInt(localStorage.getItem('el_freecount'))||0;}
function addFreeCount(){const c=getFreeCount()+1;localStorage.setItem('el_freecount',String(c));return c;}

function checkTestLimit(){
  if(isAcademyUser())return true;
  const c=getFreeCount();
  if(c>=3){showCodePrompt();return false;}
  return true;
}

function showCodePrompt(){
  const d=document.createElement('div');d.className='modal-overlay';d.id='codeModal';
  d.innerHTML=`<div class="modal-box">
    <div style="font-size:48px;margin-bottom:12px">🔒</div>
    <div class="t-title">무료 체험이 끝났어요</div>
    <div class="t-caption c-sub" style="margin-top:8px;margin-bottom:20px">계속 사용하려면 학원 코드를 입력해주세요</div>
    <input id="codeInput" class="input" placeholder="학원 코드 입력" type="password" style="letter-spacing:2px;margin-bottom:12px">
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="$('codeModal').remove()">닫기</button>
      <button class="btn btn-blue btn-sm" style="flex:1" onclick="submitCode()">확인</button>
    </div>
  </div>`;
  document.body.appendChild(d);
}

function submitCode(){
  const c=$('codeInput').value.trim();
  if(!c){toast('코드를 입력해주세요');return;}
  if(!ACADEMY_CODES.includes(c)){toast('학원 코드가 맞지 않아요');return;}
  localStorage.setItem('el_academy','1');
  $('codeModal').remove();
  toast('인증 완료! 무제한 이용 가능해요');
}

function generateChallengeURL(){
  const base=location.origin+location.pathname;
  const p=new URLSearchParams();
  p.set('sel',S.sel.join(','));
  p.set('tt',S.tt);
  p.set('qc',String(S.qs.length));
  p.set('name',profile.name);
  p.set('score',String(S.res.score));
  return base+'?'+p.toString();
}

function challengeLabel(){
  if(!S.sel||!S.sel.length)return S.tt||'시험';
  // "공통영어1/동아(이병민)/3과" → "동아(이병민) 3과"
  const parts=S.sel[0].split('/');
  if(parts.length>=3)return parts[1]+' '+parts[2];
  if(parts.length===2)return parts[1];
  return parts[0];
}
function challengeText(){
  const sc=S.res.score,name=profile.name,label=challengeLabel(),tt=S.tt||'';
  const exam=label+' '+tt;
  if(sc>=90)return `${name}이(가) ${exam}에서 ${sc}점 받았는데, 이길 수 있어? 😏`;
  if(sc>=70)return `${exam} ${sc}점! 넌 몇 점 나올까? ㅋㅋ`;
  return `${exam} ${sc}점 ㅋㅋ 같이 풀어볼래?`;
}
function shareChallenge(){
  const url=generateChallengeURL();
  const text=challengeText();
  if(navigator.share){
    navigator.share({title:'영어해방공식 — 같이 풀기',text,url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(text+'\n'+url).then(()=>toast('링크를 복사했어요!')).catch(()=>{
      const a=document.createElement('textarea');a.value=text+'\n'+url;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('링크를 복사했어요!');
    });
  }
}

// ━━ Challenge Init ━━
function initChallenge(){
  const ch=getChallenge();if(!ch)return;
  S._challenge=ch;
  // If not logged in, show challenge login
  if(!profile.name.trim()){S.scr='login';S._challengeLogin=true;R();return;}
  // Already logged in — start challenge directly
  startChallengeTest(ch);
}

function startChallengeTest(ch){
  if(!isAcademyUser()){if(!checkTestLimit())return;addFreeCount();}
  S.sel=ch.sel.split(',');S.tt=ch.tt;S.qc=ch.qc;S.mode='교과서';
  S._challengeScore=ch.score;S._challengeName=ch.name;
  startE();
  // Clean URL
  history.replaceState(null,'',location.pathname);
}

// ━━ SPEED QUIZ ━━
let sqTimer=null,sqTime=30,sqWords=[],sqIdx=0,sqCorrect=0,sqTotal=0;
let sqRivalName=null,sqRivalScore=null;

function sqRank(n){if(n>=20)return{icon:'🚀',name:'외계인'};if(n>=15)return{icon:'⚡',name:'번개'};if(n>=10)return{icon:'🦅',name:'매'};if(n>=6)return{icon:'🐇',name:'토끼'};return{icon:'🐢',name:'거북이'};}
function sqDrip(myN,rivalN){
  const gap=myN-rivalN;
  if(gap>=10)return'차원이 다르네요 🫠';if(gap>=5)return'상대를 먼지로 만들었어요 💨';
  if(gap>=3)return'압도적 승리! 🔥';if(gap>=1)return'아슬아슬한 승리! 😤';
  if(gap===0)return'운명의 라이벌?! 👀';
  if(gap>=-2)return'거의 이길 뻔했는데... 😅';if(gap>=-4)return'분하다... 다시 하자! 😤';
  return'완전 박살났어요 💀';
}
function startSpeedQuiz(){
  haptic('tap');sqTime=30;sqCorrect=0;sqTotal=0;sqIdx=0;

    if(sqTime<=0){clearInterval(sqTimer);sqTimer=null;showSQResult();}

function showSQWord(){
  if(sqIdx>=sqWords.length){sqIdx=0;shuffle(sqWords);}
  const w=sqWords[sqIdx];
  const area=$('sqWordArea');if(area)area.innerHTML=`<div class="sq-word">${w.en}</div>`;
  // Generate 4 choices (1 correct + 3 wrong)
  const others=DAILY_WORDS.filter(x=>x.en!==w.en);shuffle(others);
  const choices=[w.ko,...others.slice(0,3).map(x=>x.ko)];shuffle(choices);
  const box=$('sqChoices');if(!box)return;
  box.innerHTML=choices.map((c,i)=>`<button class="sq-btn" onclick="sqAnswer(this,${i},${choices.indexOf(w.ko)})">${c}</button>`).join('');
}
function sqAnswer(btn,picked,correct){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  sqTotal++;
  const btns=document.querySelectorAll('.sq-btn');
  if(picked===correct){
    sqCorrect++;haptic('ok');btn.classList.add('correct');
    const sc=$('sqScore');if(sc)sc.textContent=sqCorrect;
  }else{
    haptic('no');btn.classList.add('wrong');
    btns[correct].classList.add('correct');
  }
  sqIdx++;
  setTimeout(()=>{if(sqTime>0)showSQWord();},picked===correct?300:600);
}
function showSQResult(){

  const gapMax=hasRival?Math.max(sqCorrect,sqRivalScore,1):1;

      <div><div style="font-size:24px;font-weight:800;color:var(--red)" data-count="${sqTotal-sqCorrect}">0</div><div style="font-size:12px;color:var(--sub);margin-top:4px">오답</div></div>
      <div><div style="font-size:24px;font-weight:800;color:var(--blue)" data-count="${pct}">0</div><div style="font-size:12px;color:var(--sub);margin-top:4px">정답률%</div></div>

  const text=s>=15?`${n}이(가) 스피드퀴즈 30초에 ${s}개 맞춤 ㅋㅋ 이길 수 있어? 😏`
    :s>=10?`스피드퀴즈 ${s}개! 넌 몇 개 맞출 수 있어? ㅋㅋ`
    :`스피드퀴즈 ${s}개... 같이 해볼래? 😂`;
  if(navigator.share){
    navigator.share({title:'영어해방공식 스피드퀴즈 도전',text,url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(text+'\n'+url).then(()=>toast('링크를 복사했어요!')).catch(()=>{
      const a=document.createElement('textarea');a.value=text+'\n'+url;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('링크를 복사했어요!');
    });
  }
}

// ━━ FLASHCARD ━━
let fcWords=[],fcIdx=0,fcKnow=[],fcDunno=[],fcFlipped=false;

function startFlashcard(){
  haptic('tap');fcIdx=0;fcKnow=[];fcDunno=[];fcFlipped=false;
  fcWords=[...DAILY_WORDS];shuffle(fcWords);fcWords=fcWords.slice(0,20);
  S.scr='flashcard';S.dir='fwd';R();
}
function rFlashcard(){
  setBottom(null);$('tabBar').style.display='none';
  const w=fcWords[fcIdx];
  const dots=fcWords.map((_,i)=>{
    let cls='fc-dot';
    if(i<fcIdx)cls+= fcKnow.includes(i)?' done':' miss';
    if(i===fcIdx)cls+=' cur';
    return `<div class="${cls}"></div>`;
  }).join('');
  app.innerHTML=`<div class="page slide-left">
    <div style="padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between">
      <button onclick="endFlashcard()" style="border:none;background:none;font-size:22px;color:var(--sub);cursor:pointer;padding:4px">✕</button>
      <div style="font-size:15px;font-weight:700;color:var(--text)">플래시카드</div>
      <div style="font-size:14px;font-weight:600;color:var(--sub)">${fcIdx+1}/${fcWords.length}</div>
    </div>
    <div class="fc-progress" style="display:flex;gap:4px;justify-content:center;margin:16px 20px 0;flex-wrap:wrap">${dots}</div>
    <div class="fc-container" style="margin-top:20px">
      <div class="fc-card" id="fcCard" style="position:relative">
        <div class="fc-label know" id="fcLabelKnow" style="display:none">알아요</div>
        <div class="fc-label dunno" id="fcLabelDunno" style="display:none">몰라요</div>
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px">
          <div class="fc-word">${w.en}</div>
          <div class="fc-meaning" id="fcMeaning" style="display:none;margin-top:16px">${w.ko}</div>
          <div id="fcTapHint" style="font-size:13px;color:var(--hint);margin-top:24px">탭하면 뜻이 보여요</div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:0 20px;margin-top:24px">
      <button onclick="fcSwipe('left')" style="flex:1;padding:16px;border:none;border-radius:var(--r-lg);background:var(--red-l);color:var(--red);font-size:15px;font-weight:700;cursor:pointer">몰라요 ✕</button>
      <button onclick="fcSwipe('right')" style="flex:1;padding:16px;border:none;border-radius:var(--r-lg);background:var(--green-l);color:var(--green);font-size:15px;font-weight:700;cursor:pointer">알아요 ○</button>
    </div>
  </div>`;
  // Tap to flip
  const card=$('fcCard');fcFlipped=false;
  card.addEventListener('click',()=>{
    if(fcFlipped)return;fcFlipped=true;haptic('tap');
    const m=$('fcMeaning');const h=$('fcTapHint');
    if(m)m.style.display='';if(h)h.style.display='none';
    card.style.transform='rotateY(5deg)';
    setTimeout(()=>{card.style.transform='';},200);
  });
  // Touch swipe
  let sx=0,sy=0,dragging=false;
  card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dragging=true;},{passive:true});
  card.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dx=e.touches[0].clientX-sx;
    const r=Math.min(Math.max(dx/10,-15),15);
    card.style.transform=`translateX(${dx}px) rotate(${r}deg)`;
    const lk=$('fcLabelKnow'),ld=$('fcLabelDunno');
    if(lk)lk.style.display=dx>40?'':'none';
    if(ld)ld.style.display=dx<-40?'':'none';
  },{passive:true});
  card.addEventListener('touchend',e=>{
    if(!dragging)return;dragging=false;
    const dx=e.changedTouches[0].clientX-sx;
    if(dx>80)fcSwipe('right');
    else if(dx<-80)fcSwipe('left');
    else{card.style.transform='';
      const lk=$('fcLabelKnow'),ld=$('fcLabelDunno');
      if(lk)lk.style.display='none';if(ld)ld.style.display='none';
    }
  });
}
function fcSwipe(dir){
  haptic(dir==='right'?'ok':'no');
  const card=$('fcCard');
  if(dir==='right'){fcKnow.push(fcIdx);if(card)card.style.transform='translateX(300px) rotate(20deg)';card.style.opacity='0';}
  else{fcDunno.push(fcIdx);if(card)card.style.transform='translateX(-300px) rotate(-20deg)';card.style.opacity='0';}
  setTimeout(()=>{
    fcIdx++;
    if(fcIdx>=fcWords.length)showFCResult();
    else rFlashcard();
  },250);
}
function showFCResult(){
  const total=fcWords.length;const known=fcKnow.length;const pct=Math.round(known/total*100);
  addXP(known*2);
  app.innerHTML=`<div class="page slide-left">
    <div style="padding:60px 20px 20px;text-align:center">
      <div style="font-size:48px;margin-bottom:8px">${pct>=80?'🎉':pct>=50?'👍':'📚'}</div>
      <div class="t-heading" style="font-size:28px">${known}개 알고 있어요!</div>
      <div style="font-size:15px;color:var(--sub);margin-top:8px">${total}개 중 ${known}개 암기 완료 (${pct}%)</div>
    </div>
    <div class="card" style="margin-top:20px;display:flex;justify-content:space-around;text-align:center">
      <div><div style="font-size:24px;font-weight:800;color:var(--green)" data-count="${known}">0</div><div style="font-size:12px;color:var(--sub);margin-top:4px">알아요</div></div>
      <div><div style="font-size:24px;font-weight:800;color:var(--red)" data-count="${total-known}">0</div><div style="font-size:12px;color:var(--sub);margin-top:4px">몰라요</div></div>
      <div><div style="font-size:24px;font-weight:800;color:var(--blue)" data-count="${pct}">0</div><div style="font-size:12px;color:var(--sub);margin-top:4px">암기율%</div></div>
    </div>
    ${fcDunno.length?`
    <div class="sec-label">몰랐던 단어</div>
    <div class="card" style="padding:12px 16px">
      ${fcDunno.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--divider)"><span style="font-weight:700;color:var(--text)">${fcWords[i].en}</span><span style="color:var(--sub)">${fcWords[i].ko}</span></div>`).join('')}
    </div>`:''}
    <div style="font-size:13px;color:var(--sub);text-align:center;margin-top:12px">+${known*2} XP 획득!</div>
    <div style="display:flex;gap:10px;padding:20px">
      ${fcDunno.length?`<button onclick="fcRetryWrong()" style="flex:1;padding:16px;border:none;border-radius:var(--r-lg);background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer">몰랐던 단어 다시</button>`
      :`<button onclick="startFlashcard()" style="flex:1;padding:16px;border:none;border-radius:var(--r-lg);background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer">다시 하기</button>`}
      <button onclick="S.scr='learn';S.dir='back';R()" style="flex:1;padding:16px;border:none;border-radius:var(--r-lg);background:var(--g100);color:var(--text);font-size:15px;font-weight:700;cursor:pointer">돌아가기</button>
    </div>
  </div>`;
  setTimeout(applyCountUps,200);
}
function fcRetryWrong(){
  haptic('tap');const wrongWords=fcDunno.map(i=>fcWords[i]);
  fcWords=wrongWords;fcIdx=0;fcKnow=[];fcDunno=[];fcFlipped=false;
  rFlashcard();
}
function endFlashcard(){S.scr='learn';S.dir='back';R();}

// ━━ RUNNER GAME ━━
const GAME_DAILY_KEY='el_game_';
function getGameData(){const k=GAME_DAILY_KEY+new Date().toISOString().slice(0,10);try{return JSON.parse(localStorage.getItem(k))||{plays:0,shared:false};}catch(e){return{plays:0,shared:false};}}
function saveGameData(d){const k=GAME_DAILY_KEY+new Date().toISOString().slice(0,10);try{localStorage.setItem(k,JSON.stringify(d));}catch(e){}}
function getGamePlays(){const d=getGameData();const max=3+(d.shared?2:0)+(d.bonus?1:0);return Math.max(0,max-d.plays);}
function getGameBest(){return parseInt(localStorage.getItem('el_game_best'))||0;}
function setGameBest(s){if(s>getGameBest())localStorage.setItem('el_game_best',String(s));}

let gAF=null,gRunning=false;

function startRunnerGame(){
  const left=getGamePlays();
  if(left<=0){toast('오늘 횟수를 다 썼어요! 공유하면 +2회');return;}
  haptic('tap');S.scr='runnergame';S.dir='fwd';R();
}

function rRunnerGame(){
  setBottom(null);$('tabBar').style.display='none';
  const best=getGameBest();const left=getGamePlays();
  app.innerHTML=`<div class="page slide-left">
    <div style="padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between">
      <button onclick="exitGame()" style="border:none;background:none;font-size:22px;color:var(--sub);cursor:pointer;padding:4px">✕</button>
      <div style="font-size:15px;font-weight:700;color:var(--text)">영어해방 런</div>
      <div style="font-size:13px;color:var(--sub)">남은 <span style="font-weight:800;color:var(--green)">${left}회</span></div>
    </div>
    <div style="text-align:center;padding:12px 20px 8px">
      <span style="font-size:12px;color:var(--hint)">최고기록 </span>
      <span style="font-size:14px;font-weight:800;color:var(--blue)">${best}점</span>
    </div>
    <div style="padding:0 20px">
      <canvas id="gameCanvas" class="game-canvas" style="box-shadow:var(--sh-md)"></canvas>
    </div>
    <div id="gameMsg" style="text-align:center;padding:16px 20px">
      <div style="font-size:14px;color:var(--sub)">화면을 터치하면 점프!</div>
    </div>
    <div id="gameActions" style="display:none;padding:0 20px"></div>
  </div>`;
  initGame();
}

function initGame(){
  const cv=$('gameCanvas');const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;ctx.scale(dpr,dpr);

  const ground=h-30;
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const colors={bg:isDark?'#1A1A1A':'#FFFFFF',ground:isDark?'#333':'#F2F4F6',groundLine:isDark?'#555':'#D1D6DB',
    player:isDark?'#6CB4F6':'#3182F6',coin:'#F59E0B',obstacle:isDark?'#F04452':'#F04452',text:isDark?'#EEE':'#191F28',sub:isDark?'#888':'#8B95A1'};

  let py=ground-24,vy=0,jumping=false,score=0,speed=4,dist=0,alive=true,started=false,coins=[],obs=[];
  const pw=20,ph=24,gravity=0.6,jumpForce=-11;

  function spawnObs(){obs.push({x:w+20,w:16+Math.random()*12,h:20+Math.random()*16});}
  function spawnCoin(){coins.push({x:w+20,y:ground-50-Math.random()*40});}

  function jump(){if(!alive)return;if(!started){started=true;const gd=getGameData();gd.plays++;saveGameData(gd);}if(py>=ground-ph){vy=jumpForce;jumping=true;haptic('tap');}}

  cv.addEventListener('click',()=>{if(!alive&&started){return;}jump();});
  cv.addEventListener('touchstart',e=>{e.preventDefault();if(!alive&&started){return;}jump();},{passive:false});

  function update(){
    if(!started||!alive)return;
    vy+=gravity;py+=vy;
    if(py>=ground-ph){py=ground-ph;vy=0;jumping=false;}
    dist++;speed=4+Math.floor(dist/300)*0.5;
    if(dist%90===0)spawnObs();
    if(dist%70===0)spawnCoin();

    obs.forEach(o=>o.x-=speed);
    coins.forEach(c=>c.x-=speed);
    obs=obs.filter(o=>o.x>-30);
    coins=coins.filter(c=>c.x>-30);

    // Collision — obstacles
    obs.forEach(o=>{
      if(10+pw>o.x&&10<o.x+o.w&&py+ph>ground-o.h){
        alive=false;haptic('no');
      }
    });
    // Collect coins
    coins=coins.filter(c=>{
      if(Math.abs(10+pw/2-(c.x+6))<18&&Math.abs(py+ph/2-c.y)<18){
        score+=10;haptic('ok');return false;
      }return true;
    });
    score+=Math.floor(speed/4);
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    // Ground
    ctx.fillStyle=colors.ground;ctx.fillRect(0,ground,w,h-ground);
    ctx.strokeStyle=colors.groundLine;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(w,ground);ctx.stroke();
    // Ground details
    for(let i=0;i<w;i+=30){const ox=(i-dist*speed%30+30)%w;
      ctx.fillStyle=colors.groundLine;ctx.fillRect(ox,ground+8,8,2);}

    // Player (simple character)
    ctx.fillStyle=colors.player;
    const bodyX=10,bodyY=py;
    // Body
    ctx.beginPath();ctx.roundRect(bodyX,bodyY+8,pw,ph-8,4);ctx.fill();
    // Head
    ctx.beginPath();ctx.arc(bodyX+pw/2,bodyY+6,8,0,Math.PI*2);ctx.fill();
    // Eye
    ctx.fillStyle=colors.bg;ctx.beginPath();ctx.arc(bodyX+pw/2+3,bodyY+5,2,0,Math.PI*2);ctx.fill();
    // Legs (animated)
    ctx.fillStyle=colors.player;
    if(jumping){
      ctx.fillRect(bodyX+3,bodyY+ph,4,6);ctx.fillRect(bodyX+pw-7,bodyY+ph-4,4,6);
    }else{
      const legPhase=Math.sin(dist*0.3)*4;
      ctx.fillRect(bodyX+3,bodyY+ph,4,6+legPhase);ctx.fillRect(bodyX+pw-7,bodyY+ph,4,6-legPhase);
    }

    // Obstacles
    ctx.fillStyle=colors.obstacle;
    obs.forEach(o=>{ctx.beginPath();ctx.roundRect(o.x,ground-o.h,o.w,o.h,3);ctx.fill();});

    // Coins
    coins.forEach(c=>{
      ctx.fillStyle=colors.coin;ctx.beginPath();ctx.arc(c.x+6,c.y,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=colors.bg;ctx.beginPath();ctx.arc(c.x+6,c.y,3,0,Math.PI*2);ctx.fill();
    });

    // Score
    ctx.fillStyle=colors.text;ctx.font='bold 16px "Noto Sans KR",sans-serif';ctx.textAlign='right';
    ctx.fillText(score+'점',w-12,24);

    if(!started){
      ctx.fillStyle=colors.sub;ctx.font='600 14px "Noto Sans KR",sans-serif';ctx.textAlign='center';
      ctx.fillText('터치하여 시작',w/2,h/2);
    }

    if(!alive){
      ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#FFF';ctx.font='bold 20px "Noto Sans KR",sans-serif';ctx.textAlign='center';
      ctx.fillText('GAME OVER',w/2,h/2-10);
      ctx.font='600 14px "Noto Sans KR",sans-serif';
      ctx.fillText(score+'점',w/2,h/2+16);
    }
  }

  function loop(){
    if(!alive&&started){
      draw();endGameRound(score);return;
    }
    update();draw();gAF=requestAnimationFrame(loop);
  }
  gRunning=true;loop();
}

function endGameRound(score){
  gRunning=false;
  setGameBest(score);const best=getGameBest();const isNew=score>=best;
  addXP(Math.floor(score/10));
  const xpGain=Math.floor(score/10);
  const gd=getGameData();const left=getGamePlays();

  const msg=$('gameMsg');const act=$('gameActions');
  if(msg)msg.innerHTML=`
    <div style="font-size:${isNew?'16px':'14px'};font-weight:800;color:${isNew?'var(--blue)':'var(--text)'};margin-bottom:4px">${isNew?'🎉 새 최고기록!':'GAME OVER'}</div>
    <div style="font-size:24px;font-weight:900;color:var(--text)">${score}점</div>
    <div style="font-size:12px;color:var(--sub);margin-top:4px">최고기록 ${best}점 · +${xpGain} XP</div>
    ${left>0?`<div style="font-size:12px;color:var(--green);margin-top:4px;font-weight:600">남은 횟수: ${left}회</div>`
    :`<div style="font-size:12px;color:var(--red);margin-top:4px;font-weight:600">오늘 횟수 소진! 공유하면 +2회</div>`}`;

  if(act){act.style.display='';
    act.innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:8px">
      <button onclick="shareGame(${score})" style="flex:1;padding:14px;border:none;border-radius:var(--r-lg);background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer">🤝 자랑하기 ${!gd.shared?'(+2회)':''}</button>
      ${left>0?`<button onclick="retryGame()" style="flex:1;padding:14px;border:none;border-radius:var(--r-lg);background:var(--g100);color:var(--text);font-size:14px;font-weight:700;cursor:pointer">다시 하기</button>`
      :`<button onclick="exitGame()" style="flex:1;padding:14px;border:none;border-radius:var(--r-lg);background:var(--g100);color:var(--text);font-size:14px;font-weight:700;cursor:pointer">돌아가기</button>`}
    </div>
    <button onclick="exitGame()" style="width:100%;padding:10px;border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer">학습 탭으로</button>`;}
}

function retryGame(){
  const left=getGamePlays();
  if(left<=0){toast('오늘 횟수를 다 썼어요! 공유하면 +2회');return;}
  if(gAF){cancelAnimationFrame(gAF);gAF=null;}
  rRunnerGame();
}

function shareGame(score){
  const gd=getGameData();
  if(!gd.shared){gd.shared=true;saveGameData(gd);toast('+2회 추가!');}
  const best=getGameBest();
  const text=score>=200?`영어해방 런에서 ${score}점! 이 기록 깰 수 있어? 😏`
    :score>=100?`영어해방 런 ${score}점! 넌 몇 점? ㅋㅋ`
    :`영어해방 런 ${score}점... 같이 해볼래? 😂`;
  const url=location.origin+location.pathname+'?mode=run&name='+encodeURIComponent(profile.name)+'&score='+score;
  if(navigator.share){
    navigator.share({title:'영어해방 런 도전',text,url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(text+'\n'+url).then(()=>toast('링크를 복사했어요!')).catch(()=>{
      const a=document.createElement('textarea');a.value=text+'\n'+url;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('링크를 복사했어요!');
    });
  }
  // Refresh UI to show updated play count
  const act=$('gameActions');if(act){
    const left=getGamePlays();
    const msg=$('gameMsg');
    if(msg){const spans=msg.querySelectorAll('div');
      const lastDiv=spans[spans.length-1];
      if(lastDiv&&left>0){lastDiv.style.color='var(--green)';lastDiv.textContent='남은 횟수: '+left+'회';}
    }
  }
}

function exitGame(){
  if(gAF){cancelAnimationFrame(gAF);gAF=null;}
  gRunning=false;S.scr='learn';S.dir='back';R();
}

R();

// Check for challenge params after initial render
const _ch=getChallenge();
if(_ch){
  if(_ch.mode==='sq'){
    sqRivalName=_ch.name;sqRivalScore=_ch.score;S._sqChallenge=_ch;
    history.replaceState(null,'',location.pathname);
    if(profile.name.trim()){setTimeout(()=>startSpeedQuiz(),300);}
    else{S._challenge=_ch;}
  }else if(_ch.mode==='run'){
    history.replaceState(null,'',location.pathname);
    // Give +1 bonus play for entering via challenge link
    const gd=getGameData();if(!gd.bonus){gd.bonus=true;saveGameData(gd);}
    if(profile.name.trim()){setTimeout(()=>startRunnerGame(),300);}
    else{S._challenge=_ch;}
  }else{
    S._challenge=_ch;
    if(profile.name.trim()){setTimeout(()=>startChallengeTest(_ch),300);}
  }
}
